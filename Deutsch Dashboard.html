an, fragen nach, träumen von, erzählen von, abhängen von, sich verabschieden von, bestehen aus, gehören zu, sprechen mit, sich unterhalten mit, Angst haben vor, leiden an/unter.","Ich träume von einem Haus am Meer. Das hängt vom Wetter ab.","I dream of a house by the sea. That depends on the weather.","","","✔","","Full list on 'Verb+Preposition'."],["","B1","11","da-/wo-compounds","With dass / zu","Anticipating a clause: Ich freue mich darauf, dass du kommst. Ich warte darauf, dich zu sehen.","Ich freue mich darauf, dich zu sehen.","I'm looking forward to seeing you.","","","","","Same subject → zu-Infinitiv; different subject → dass."],["","B1","11","Infinitive clauses","zu + Infinitiv (verbs, adjectives, nouns)","Verbs: anfangen, aufhören, beginnen, vergessen, versuchen, vorhaben, planen, hoffen, empfehlen. Adjectives: Es ist wichtig/schön/möglich, … zu. Nouns: Ich habe Lust/Zeit/Angst/keine Lust, … zu.","Es ist wichtig, regelmäßig zu üben.","It's important to practise regularly.","","","","",""],["","B1","11","Infinitive clauses","ohne … zu / (an)statt … zu","ohne … zu = without doing; (an)statt … zu = instead of doing. Same subject.","Er ging, ohne sich zu verabschieden. Statt zu lernen, schaute sie fern.","He left without saying goodbye. Instead of studying she watched TV.","","","","",""],["","B1","11","Infinitive without zu","Verbs + bare infinitive","modal verbs, lassen, gehen, bleiben, sehen, hören, fahren, lernen: Ich gehe schwimmen. Ich lasse das Auto reparieren. Ich höre ihn singen.","Ich lasse mir die Haare schneiden.","I'm getting my hair cut.","","✔","✔","",""],["","B1","11","Infinitive clauses","sein/haben + zu","sein + zu + Inf = can/must be done (passive sense). haben + zu + Inf = must (active).","Das Problem ist leicht zu lösen. Ich habe noch viel zu tun.","The problem is easy to solve. I still have a lot to do.","","","","",""],["","B1","12","Conjunctions","Two-part conjunctions – order","sowohl…als auch / weder…noch / entweder…oder / nicht nur…sondern auch connect equal parts (no word-order change). zwar…aber: verb 2nd after 'zwar'. je…desto: verb LAST after je, INVERSION after desto.","Je mehr ich lerne, desto besser verstehe ich.","The more I learn, the better I understand.","","","","","Full list on 'Connectors'."],["","B1","12","Connectors","Conjunction vs. connector adverb","Coordinating (und, aber, oder, denn, sondern): position 0. Subordinating (weil, dass, obwohl…): verb LAST. Adverbial connectors (deshalb, trotzdem, außerdem…): position 1, verb in position 2.","Er ist krank, trotzdem arbeitet er. / Er arbeitet, obwohl er krank ist.","He is sick, yet he works. / He works although he is sick.","","","","","Key skill for coherent writing."],["","B1","12","Nouns","Gender from endings","die: -ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ur, -enz, -anz. der: -er (agent), -ismus, -ling, -ig, -or, -us. das: -chen, -lein, -um, -ment, -o, Ge- (nouns from verbs: das Essen).","die Wohnung, die Freiheit, der Lehrer, das Mädchen, das Zimmer","the flat, freedom, the teacher, the girl, the room","","","","","Exceptions exist (der Käse, die Butter) – always learn with article."],["","B1","12","Word formation","Compound nouns","Gender = LAST part: die Haustür (das Haus + die Tür). Linking elements (Fugen): -s (Arbeitsplatz), -en (Studentenwohnheim), -e (Hundehütte), none (Handschuh).","der Geburtstagskuchen, die Krankenversicherung","birthday cake, health insurance","","","","",""],["","B1","12","Word formation","Prefixes & suffixes","un- (negation), -los (without), -voll (full of), -bar (able), -lich/-ig (adj.), -er/-in (person), ver-/zer-/ent-/be-/er- (verb prefixes).","unglücklich, hilflos, lesbar, Lehrerin","unhappy, helpless, readable, female teacher","","","","",""],["","B1","12","Letters","Complaint / request letter","Betreff, Anrede, Grund des Schreibens, Problem, Forderung, Frist, Schlussformel. Use Sie-form, KII politeness.","Leider musste ich feststellen, dass die Ware beschädigt war. Ich bitte Sie, mir den Betrag zu erstatten.","Unfortunately I found the goods were damaged. I ask you to refund me.","","","","",""],["","B1","13","Prepositions","With Akkusativ","durch, für, gegen, ohne, um, bis, entlang (nachgestellt). Sheet 'Prepositions'.","Ohne dich wäre es langweilig. Das ist gut für die Gesundheit.","Without you it would be boring. That is good for your health.","","✔","","",""],["","B1","13","Prepositions","With Dativ","aus, außer, bei, mit, nach, seit, von, zu, gegenüber, ab. Sheet 'Prepositions'.","Seit dem Sommer wohne ich bei meiner Tante.","Since summer I've lived with my aunt.","","","✔","",""],["","B1","13","Prepositions","Two-way (Wechsel)","an, auf, hinter, in, neben, über, unter, vor, zwischen: Akk (movement) / Dat (location). Über = about (topic): always Akkusativ.","Wir sprechen über das Wetter. Er hängt das Bild an die Wand.","We're talking about the weather. He hangs the picture on the wall.","","✔","✔","",""],["","B1","13","Prepositions","With Genitiv","wegen, trotz, während, statt, innerhalb, außerhalb + (later) aufgrund, angesichts…","Innerhalb einer Woche bekommen Sie eine Antwort.","Within a week you'll get an answer.","","","","✔",""],["","B1","13","Temporal prepositions","vor, nach, seit, ab, bis, während, innerhalb, gegen, um, zwischen","vor/nach/seit/ab + Dat; bis/gegen/um + Akk (or none); während/innerhalb + Gen; zwischen + Dat.","Zwischen dem 1. und 5. Mai bin ich verreist.","Between May 1st and 5th I'm away.","","✔","✔","",""],["","B1","13","Complex sentences","Multiple clauses","Main + relative + weil/wenn + infinitive: commas separate every clause; each Nebensatz verb goes LAST. Avoid more than 2 layers when speaking.","Ich glaube, dass der Mann, den ich gestern getroffen habe, uns helfen kann, weil er Arzt ist.","I think the man I met yesterday can help us because he is a doctor.","","","","",""],["","B1","13","lassen","lassen (3 uses)","1) allow: Sie lässt mich fahren. 2) cause to be done: Ich lasse das Auto reparieren. 3) sich lassen + Inf (passive sense): Das lässt sich machen. Perfekt: hat … lassen (double infinitive).","Ich habe mir die Haare schneiden lassen.","I had my hair cut.","","✔","✔","",""],["","B1","13","Perception verbs","sehen, hören, spüren + Infinitiv","Ich sehe ihn kommen. Ich höre sie singen. Perfekt: double infinitive (Ich habe ihn kommen sehen).","Ich habe ihn weggehen sehen.","I saw him leave.","","✔","","",""],["","B1","13","Review","B1 grammar checklist","Nebensätze (weil, dass, obwohl, damit…); Präteritum & Plusquamperfekt; relative clauses; Genitiv; adjective endings; passive; KII; verb+preposition; infinitive clauses; two-part conjunctions.","Mock exam: aim for ≥ 70 % in each module.","","✔","✔","✔","✔","Log every error in a notebook (sheet 'Common Mistakes' helps)."],["","B2","14","Futur","Futur I","werden + Infinitiv. Two meanings: future (Ich werde umziehen) and PRESENT assumption (Er wird wohl krank sein).","Sie wird jetzt wohl schlafen.","She is probably sleeping now.","","","","","With 'wohl/bestimmt/sicher' = assumption."],["","B2","14","Futur","Futur II","werden + Partizip II + haben/sein. Completed action in the future or assumption about the past.","Bis morgen werde ich das Buch gelesen haben. Er wird den Zug verpasst haben.","By tomorrow I'll have read the book. He probably missed the train.","","","","",""],["","B2","14","Tense use","Tense in narratives","Präteritum = main storyline; Plusquamperfekt = earlier background; Perfekt = spoken/reporting; historic present for vividness.","Als er ankam, hatte der Film schon begonnen.","When he arrived the film had already started.","","","","",""],["","B2","15","Konjunktiv I","Forms","stem + -e, -est, -e, -en, -et, -en. sein: sei, seiest, sei, seien, seiet, seien. Used mostly in the 3rd person singular (er habe, sei, komme, werde).","Der Minister sagte, er sei krank und habe keine Zeit.","The minister said he was ill and had no time.","","","","","If KI = indicative form (wir haben), use KII (wir hätten)."],["","B2","15","Konjunktiv I","Tenses in indirect speech","Present: er komme. Past: er sei gekommen / habe gesagt. Future: er werde kommen. Questions: ob/W-word. Requests: solle/möge.","Sie fragte, ob er komme. Er sagte, sie solle warten.","She asked whether he was coming. He said she should wait.","","","","",""],["","B2","15","Konjunktiv I","Indicative in daily speech","In spoken German indirect speech often uses the indicative or KII: Er sagt, er ist krank / er wäre krank.","Er sagte, dass er keine Zeit hat.","He said that he has no time.","","","","","KI is mainly written/journalistic."],["","B2","16","Passive","Passive with modals & Perfekt","Present: muss gemacht werden. Perfekt: muss gemacht worden sein. Past unreal: hätte gemacht werden müssen.","Der Fehler hätte vermieden werden können.","The mistake could have been avoided.","✔","","","",""],["","B2","16","Passive","Subjectless passive","Es wird getanzt. / Heute wird gefeiert. Impersonal, focus on action.","Hier wird gearbeitet.","Work is being done here.","","","","",""],["","B2","16","Passive alternatives","man / sich lassen / sein + zu / -bar","man: Man kann das lösen. sich lassen + Inf: Das lässt sich lösen. sein + zu + Inf: Das ist zu lösen. -bar/-lich: lösbar, erklärlich. bekommen-Passiv: Ich bekomme das Paket geschickt (Dat → subject).","Das Problem lässt sich lösen. / Das Problem ist lösbar.","The problem can be solved.","✔","✔","✔","","bekommen-Passiv: Dativ (mir) becomes the subject (ich)."],["","B2","17","Participles","Partizip I as adjective","Infinitive + -d: lachen → lachend. Active, simultaneous. + adjective ending: das lachende Kind.","die steigenden Preise, ein überzeugendes Argument","rising prices, a convincing argument","✔","✔","✔","✔",""],["","B2","17","Participles","Partizip II as adjective","Passive/completed meaning: das gelesene Buch = the book that was read. With intransitive sein-verbs: active: der gestiegene Preis.","der gekochte Fisch, das geöffnete Fenster","the cooked fish, the opened window","✔","✔","✔","✔",""],["","B2","17","Participles","Extended participial attributes","Between article and noun: die von vielen Touristen besuchte Stadt = die Stadt, die von vielen Touristen besucht wird. Read from the noun backwards.","Die im Jahr 1990 gegründete Firma wächst schnell.","The company founded in 1990 is growing fast.","✔","✔","✔","✔","Typical of academic/journalistic style."],["","B2","17","Participles","zu + Partizip I","zu + Partizip I = passive with müssen/können: die zu lösende Aufgabe = die Aufgabe, die gelöst werden muss.","die zu erwartenden Probleme","the expected problems","","","","",""],["","B2","18","Nominalstil","Verb → noun","-ung (Entscheidung), -en → das Lesen, stem (Beginn, Besuch, Verkauf), -e (Frage), -nis (Erlebnis), -heit/-keit (Sicherheit), -ion (Diskussion).","Die Entscheidung des Gerichts wurde gestern bekannt gegeben.","The court's decision was announced yesterday.","","","","✔",""],["","B2","18","Nominalstil","Nebensatz → Präpositionalphrase","weil → wegen/aufgrund + Gen; obwohl → trotz + Gen; wenn → bei + Dat / im Falle + Gen; nachdem → nach + Dat; bevor → vor + Dat; damit → zum/zur (Dat) / zwecks + Gen; während → während + Gen.","Trotz des Regens fand das Fest statt.","Despite the rain the festival took place.","","","✔","✔","Spoken: Weil es regnet… Formal written: Wegen des Regens…"],["","B2","18","Funktionsverbgefüge","Noun–verb collocations","in Betracht ziehen, zur Verfügung stellen, in Frage stellen, Kritik üben (an + Dat), eine Entscheidung treffen, Rücksicht nehmen (auf + Akk), in Kraft treten, zum Ausdruck bringen, unter Beweis stellen, zur Diskussion stellen.","Wir ziehen mehrere Möglichkeiten in Betracht.","We are considering several options.","","✔","","","Fixed combos: don't change the preposition or article."],["","B2","19","Connectors","Cause","da, zumal, nämlich, aufgrund/angesichts + Gen. See 'Connectors' sheet.","Da das Wetter schlecht ist, bleiben wir zu Hause.","Since the weather is bad we're staying home.","","","","",""],["","B2","19","Connectors","Consequence","sodass / so … dass, folglich, infolgedessen, somit, demnach.","Es regnete so stark, dass das Spiel abgesagt wurde.","It rained so hard that the match was cancelled.","","","","",""],["","B2","19","Connectors","Concession","obgleich, obschon, wenngleich, auch wenn, dennoch, nichtsdestotrotz, zwar … aber.","Obgleich er müde war, arbeitete er weiter.","Although he was tired he kept working.","","","","",""],["","B2","19","Connectors","Purpose","damit, um … zu, zu diesem Zweck, dafür.","Wir sparen Energie, damit die Kosten sinken.","We save energy so that costs fall.","","","","",""],["","B2","20","Connectors","Condition","falls, sofern, soweit, es sei denn, vorausgesetzt (dass), andernfalls, je nachdem, im Falle.","Sofern keine Einwände bestehen, beginnen wir morgen.","Provided there are no objections we'll start tomorrow.","","","","",""],["","B2","20","Connectors","Manner","indem, dadurch dass, ohne dass, (an)statt dass.","Er lernt Deutsch, indem er viele Podcasts hört.","He learns German by listening to many podcasts.","","","","",""],["","B2","20","Connectors","Contrast","während, wohingegen, hingegen, jedoch.","Er ist sehr ordentlich, wohingegen seine Schwester chaotisch ist.","He is very tidy whereas his sister is chaotic.","","","","",""],["","B2","20","Conditionals","Conditional without 'wenn'","Verb first replaces wenn: Hätte ich Zeit, würde ich kommen. / Sollte es regnen, bleiben wir hier.","Wäre ich reich, würde ich reisen.","If I were rich I'd travel.","","","","",""],["","B2","21","Genitive prepositions","aufgrund, angesichts, anlässlich, infolge…","aufgrund (due to), angesichts (in view of), anlässlich (on the occasion of), infolge (as a result of), mithilfe/mittels (by means of), anhand (based on), hinsichtlich/bezüglich (regarding), zugunsten (in favour of), seitens (on the part of), ungeachtet (regardless of), zwecks (for the purpose of).","Aufgrund der Krise werden Stellen gestrichen.","Due to the crisis jobs are being cut.","","","","✔","Sheet 'Prepositions' has one example each."],["","B2","21","Dativ prepositions","gemäß, entsprechend, zufolge, dank, laut","gemäß/entsprechend + Dat (Gemäß den Regeln…); zufolge follows its noun (Der Studie zufolge…); dank/laut + Dat or Gen.","Der Studie zufolge steigen die Preise.","According to the study prices are rising.","","","✔","",""],["","B2","21","Genitive verbs","bedürfen, gedenken, sich bedienen…","Rare, formal, legal: bedürfen (Das bedarf einer Genehmigung), gedenken (Wir gedenken der Opfer), sich bedienen, anklagen/beschuldigen + Gen (des Betrugs).","Das Projekt bedarf einer Genehmigung.","The project requires approval.","","","","✔",""],["","B2","21","Genitive adjectives","Adjective + Genitiv","einer Sache bewusst/sicher/würdig/mächtig/wert sein.","Ich bin mir der Gefahr bewusst.","I am aware of the danger.","","","","✔",""],["","B2","22","Prepositions","Adjective + preposition","stolz auf +A, angewiesen auf +A, zufrieden mit +D, typisch für +A, abhängig von +D, interessiert an +D, begeistert von +D. See 'Verb+Preposition'.","Ich bin stolz auf meine Tochter.","I'm proud of my daughter.","","✔","✔","",""],["","B2","22","Prepositions","Noun + preposition","Interesse an +D, Angst vor +D, Einfluss auf +A, Ursache für +A, Verständnis für +A, Beitrag zu +D, Frage nach +D.","Das hat großen Einfluss auf die Wirtschaft.","This has a great influence on the economy.","","✔","✔","",""],["","B2","22","da-compounds","Anticipating a clause","Ich bestehe darauf, dass…; Es hängt davon ab, ob…; Ich rechne damit, dass….","Es kommt darauf an, ob das Wetter gut ist.","It depends on whether the weather is good.","","","","",""],["","B2","23","Konjunktiv II","als ob / als wenn","als ob + KII (verb final) or als + KII (verb 2nd): Er tut, als ob er alles wüsste. / Er tut, als wüsste er alles.","Sie sieht aus, als ob sie krank wäre.","She looks as if she were sick.","","","","",""],["","B2","23","Konjunktiv II","Wishes & conditionals without wenn","Hätte ich doch mehr Zeit! Wäre er pünktlich gewesen, hätte er den Zug erreicht.","Wäre ich doch nur früher gekommen!","If only I had come earlier!","","","","",""],["","B2","23","Konjunktiv II","Past with modals","hätte + Infinitiv + Modal (double infinitive): Ich hätte kommen können/müssen/sollen.","Du hättest mich anrufen können.","You could have called me.","","","","",""],["","B2","23","Konjunktiv II","Careful/polite statements","Ich würde sagen…, Das dürfte stimmen (= probably), Es wäre schön, wenn…, Ich hätte eine Frage.","Ich würde sagen, das ist ein Missverständnis.","I would say that's a misunderstanding.","","","","",""],["","B2","24","Modal verbs","Subjective meaning","müssen = sure (Er muss krank sein); dürfte = probably (Er dürfte krank sein); können/könnte = possibly; sollen = reportedly (Er soll reich sein); wollen = claims (Er will es nicht gewusst haben); mögen = may be (Es mag sein).","Er dürfte schon zu Hause sein.","He's probably already at home.","","","","","Past: modal + Perfekt-Infinitiv (Er muss den Zug verpasst haben)."],["","B2","24","Modal particles","ja, doch, mal, eben/halt, denn, wohl, eigentlich","ja = as you know; doch = contradiction/reminder; mal = softener; eben/halt = it is what it is; denn = curiosity; wohl = probably; eigentlich = actually; schon = do indeed; aber = surprise; bloß/nur = emphasis; ruhig = go ahead; vielleicht = surprise; etwa = surprised question.","Komm doch mal vorbei! Das ist halt so.","Do drop by! That's just how it is.","","","","","Not translatable 1:1 – learn in chunks."],["","B2","25","Register","Formal vs. informal","bekommen → erhalten; fragen → sich erkundigen; kaufen → erwerben; anfangen → beginnen; helfen → unterstützen; wegen → aufgrund. Bezug nehmen auf + Akk. Polite KII: Ich wäre Ihnen dankbar, wenn…","Ich beziehe mich auf Ihr Schreiben vom 3. Mai.","I refer to your letter of May 3rd.","","✔","","",""],["","B2","25","Application","Bewerbung structure","Anschreiben: Betreff, Anrede, Einleitung (Bezug auf Anzeige), Qualifikation, Motivation, Schluss (Interview). Lebenslauf: tabellarisch, Foto optional.","Hiermit bewerbe ich mich um die ausgeschriebene Stelle.","I hereby apply for the advertised position.","","✔","","",""],["","B2","26","Argumentation","Argument structure","These → Argument → Beispiel → Schlussfolgerung. Concession: Zwar…, aber…; Natürlich…, dennoch… Hedging: Es scheint, dass…; Vermutlich…","Einerseits spart man Zeit, andererseits leidet die Qualität.","On the one hand you save time, on the other quality suffers.","","","","",""],["","B2","26","Argumentation","Evaluation phrases","Meiner Meinung nach…, Ich bin der Ansicht, dass…, Ich halte es für…, Es lässt sich nicht bestreiten, dass…, Es spricht vieles dafür, dass…","Ich halte diese Lösung für unrealistisch.","I consider this solution unrealistic.","","✔","","",""],["","B2","27","Data description","Trend verbs & prepositions","steigen/sinken (um + Akk, auf + Akk), zunehmen, abnehmen, stagnieren, schwanken, sich verdoppeln/halbieren; von … auf …; zwischen … und …; im Vergleich zu/gegenüber + Dat; Anteil an + Dat.","Die Zahl stieg um 10 % auf 500.","The number rose by 10% to 500.","","✔","✔","","um = difference; auf = new level."],["","B2","27","Data description","Comparisons with numbers","doppelt so hoch wie, dreimal so viel wie, halb so groß wie; um die Hälfte gestiegen; ein Drittel/Viertel.","Der Umsatz ist doppelt so hoch wie im Vorjahr.","Sales are twice as high as last year.","","","","",""],["","B2","28","Word formation","Prefix verbs (separable/inseparable)","über-, unter-, um-, durch-, hinter-, wieder-, wider-: separable = literal/physical (Er setzt uns über); inseparable = figurative (Ich übersetze den Text). Stress differs: ÜBERsetzen vs. überSETzen.","Der Zug umfährt die Stadt. / Er fährt den Zaun um.","The train bypasses the city. / He runs over the fence.","","","","",""],["","B2","28","Idioms","Idioms & collocations","Ich drücke dir die Daumen. / Das ist mir Wurst. / Ich verstehe nur Bahnhof. / Das geht auf keine Kuhhaut.","Ich verstehe nur Bahnhof.","It's all Greek to me.","","","","","Learn idioms in chunks with an equivalent in your own language."],["","B2","29","Text cohesion","Pronominal adverbs (da-/hier-)","dabei, dafür, dadurch, damit, davon, daran, hierbei, hierzu, hierfür refer back to a noun/sentence.","Hierzu gibt es unterschiedliche Meinungen.","There are different opinions about this.","","","","",""],["","B2","29","Text cohesion","dieser / jener / ersterer / letzterer","Ersterer/Letzterer = the former/the latter. Dieser/Jener as referential words.","Ich kenne Anna und Petra; Letztere wohnt in Wien.","I know Anna and Petra; the latter lives in Vienna.","✔","✔","✔","✔",""],["","B2","30","Word order","Vorfeld, Mittelfeld, Nachfeld","Vorfeld: pos. 1. Linke Satzklammer: finite verb. Mittelfeld: subject, pronouns (Akk<Dat), nouns (Dat<Akk), Te-Ka-Mo-Lo. Rechte Satzklammer: infinitive/participle. Nachfeld: relative/comparative/long clauses.","Gestern hat mir mein Bruder das Buch gegeben, das ich suchte.","Yesterday my brother gave me the book I was looking for.","✔","✔","✔","✔",""],["","B2","30","Word order","Topic fronting","Any element can go first for emphasis; the verb stays 2nd: Den Film habe ich schon gesehen. / Dem Kind gab er den Ball.","Diesen Film habe ich schon dreimal gesehen.","I've already seen this film three times.","✔","✔","✔","",""],["","B2","31","Modality verbs","scheinen, pflegen, drohen, versprechen, brauchen + zu","scheinen zu (seem), pflegen zu (usually do), drohen zu (threaten to), versprechen zu (promise to), brauchen zu (need to; usually with nicht/nur/kein).","Er scheint müde zu sein. Du brauchst nicht zu kommen.","He seems to be tired. You don't need to come.","","","","",""],["","B2","31","Reformulation","Rephrasing phrases","das heißt, mit anderen Worten, anders gesagt, genauer gesagt, um es kurz zu machen","Genauer gesagt, geht es um Kosten.","To be more precise it's about costs.","","","","",""],["","B2","32","Review","Complete case overview","Nominativ (subject), Akkusativ (direct object; durch/für/gegen/ohne/um), Dativ (indirect object; aus/bei/mit/nach/seit/von/zu), Genitiv (possession; wegen/trotz/während/statt), Wechsel prepositions. Check every noun phrase: article + adjective + noun.","Trotz des starken Regens (G) gab ich dem Mann (D) meinen (A) Schirm.","Despite the heavy rain I gave the man my umbrella.","✔","✔","✔","✔",""],["","B2","33","Exam","B2 exam strategies","Lesen: skim first, then scan; Hören: read questions first; Schreiben: plan 5 min, write 3 paragraphs, proofread; Sprechen: structure (Einleitung – Argumente – Fazit), use connectors.","Ich möchte kurz zusammenfassen…","I'd like to summarise briefly…","","","","",""]]},"Connectors":{"h":["Status","Week","Level","Type","Connector","Meaning","Word order / position","Rule","Example (DE)","English"],"r":[["","1","A1","Coordinating","und","and","Position 0 – verb stays 2nd","Adds information. Same subject in both parts → you can drop the second subject. No comma needed.","Ich lerne Deutsch und mein Bruder lernt Spanisch.","I learn German and my brother learns Spanish."],["","1","A1","Coordinating","aber","but","Position 0 – verb stays 2nd","Contrast / unexpected result. Comma before aber.","Ich möchte kommen, aber ich habe keine Zeit.","I'd like to come but I have no time."],["","1","A1","Coordinating","oder","or","Position 0 – verb stays 2nd","Alternative / choice. Also in questions.","Trinkst du Tee oder Kaffee?","Do you drink tea or coffee?"],["","1","A1","Coordinating","denn","because (reason)","Position 0 – verb stays 2nd","Gives a reason; comma before; word order unchanged (unlike weil).","Ich bleibe zu Hause, denn ich bin krank.","I'm staying home because I'm sick."],["","1","A1","Coordinating","sondern","but rather","Position 0 – verb stays 2nd","Corrects a negated statement (nicht/kein … sondern). Comma before.","Ich trinke keinen Kaffee, sondern Tee.","I don't drink coffee but tea."],["","2","A1","Sequence adverb","zuerst / dann / danach","first / then / after that","Position 1 – verb 2nd (inversion)","Time sequence; the connector takes position 1, so the verb comes 2nd.","Zuerst frühstücke ich, dann gehe ich zur Arbeit.","First I have breakfast, then I go to work."],["","5","A2","Subordinating","weil","because","Nebensatz – verb LAST","Reason. Comma before. If the weil-clause comes first, the main clause starts with the verb.","Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","I learn German because I want to work in Germany."],["","5","A2","Subordinating","dass","that","Nebensatz – verb LAST","Content clause after sagen, glauben, wissen, hoffen… Comma before.","Ich glaube, dass er heute kommt.","I think (that) he's coming today."],["","5","A2","Subordinating","wenn","if / when(ever)","Nebensatz – verb LAST","Condition, or repeated event (present / past habit / future).","Wenn es regnet, bleibe ich zu Hause.","If it rains I stay at home."],["","5","A2","Subordinating","ob","whether / if","Nebensatz – verb LAST","Indirect yes/no question.","Ich weiß nicht, ob er kommt.","I don't know whether he's coming."],["","5","A2","Subordinating","als","when (one event in the past)","Nebensatz – verb LAST","Single past event; wenn is for repeated events.","Als ich klein war, wohnten wir in Köln.","When I was little we lived in Cologne."],["","6","A2","Infinitive","um … zu","in order to","Nebensatz – verb LAST (infinitive clause)","Purpose; SAME subject in both clauses; zu + infinitive at the end.","Ich lerne Deutsch, um in Deutschland zu arbeiten.","I learn German in order to work in Germany."],["","7","A2","Connector adverb","deshalb / darum / deswegen","therefore","Position 1 – verb 2nd (inversion)","Consequence. Position 1 + verb 2.","Ich bin krank, deshalb bleibe ich zu Hause.","I'm sick, therefore I stay home."],["","7","A2","Connector adverb","trotzdem","nevertheless","Position 1 – verb 2nd (inversion)","Contrast against expectation.","Es regnet, trotzdem gehen wir spazieren.","It's raining; we go for a walk anyway."],["","7","A2","Connector adverb","außerdem","besides / in addition","Position 1 – verb 2nd (inversion)","Adds a further point.","Ich habe keine Zeit. Außerdem bin ich müde.","I have no time. Besides, I'm tired."],["","7","A2","Connector adverb","sonst","otherwise","Position 1 – verb 2nd (inversion)","Warns about a consequence.","Beeil dich, sonst verpasst du den Zug.","Hurry up, otherwise you'll miss the train."],["","7","A2","Subordinating","bevor","before","Nebensatz – verb LAST","Time: action happens later than the main clause.","Bevor ich schlafe, lese ich.","Before I sleep I read."],["","7","A2","Subordinating","nachdem","after","Nebensatz – verb LAST","Time: earlier action; Perfekt in the Nebensatz, Präsens in the main clause (Plusquamperfekt/Präteritum in the past).","Nachdem ich gegessen habe, gehe ich spazieren.","After I've eaten I go for a walk."],["","7","A2","Subordinating","während","while","Nebensatz – verb LAST","Simultaneous actions.","Während ich koche, hört er Musik.","While I cook he listens to music."],["","8","B1","Subordinating","da","since / as (known reason)","Nebensatz – verb LAST","Reason already known; often at the start of the sentence.","Da es regnet, bleiben wir zu Hause.","Since it's raining we stay at home."],["","8","B1","Subordinating","obwohl","although","Nebensatz – verb LAST","Concession. Main clause states the unexpected result.","Obwohl er müde war, arbeitete er weiter.","Although he was tired he kept working."],["","8","B1","Subordinating","damit","so that","Nebensatz – verb LAST","Purpose with a DIFFERENT subject (same subject → um … zu).","Ich erkläre es dir, damit du es verstehst.","I explain it to you so that you understand."],["","8","B1","Subordinating","sobald","as soon as","Nebensatz – verb LAST","Time: immediately when.","Sobald ich Zeit habe, rufe ich dich an.","As soon as I have time I'll call you."],["","8","B1","Subordinating","bis","until","Nebensatz – verb LAST","Time limit.","Ich warte, bis du kommst.","I'll wait until you come."],["","8","B1","Subordinating","seit / seitdem","since","Nebensatz – verb LAST","Time: from a point until now.","Seitdem ich hier wohne, lerne ich Deutsch.","Since I've lived here I've been learning German."],["","8","B1","Subordinating","falls","in case / if","Nebensatz – verb LAST","Condition (possible but uncertain).","Falls es regnet, nehmen wir den Bus.","In case it rains we take the bus."],["","8","B1","Subordinating","sodass / so … dass","so that / so … that","Nebensatz – verb LAST","Result / consequence.","Es regnete so stark, dass das Spiel ausfiel.","It rained so hard that the match was cancelled."],["","8","B1","Time adverb","damals / früher / vorher / inzwischen","back then / earlier / before / meanwhile","Position 1 – verb 2nd (inversion)","Time reference in narratives.","Damals wohnte er in Wien.","Back then he lived in Vienna."],["","11","B1","Infinitive","ohne … zu","without doing","Nebensatz – verb LAST (infinitive clause)","Same subject.","Er ging, ohne sich zu verabschieden.","He left without saying goodbye."],["","11","B1","Infinitive","(an)statt … zu","instead of doing","Nebensatz – verb LAST (infinitive clause)","Same subject.","Statt zu lernen, schaute sie fern.","Instead of studying she watched TV."],["","12","B1","Two-part","entweder … oder","either … or","Parts connect equal elements","Two alternatives.","Entweder fahren wir mit dem Zug oder wir nehmen das Auto.","Either we take the train or we take the car."],["","12","B1","Two-part","sowohl … als auch","both … and","Connects equal elements","Adds two items.","Er spricht sowohl Deutsch als auch Englisch.","He speaks both German and English."],["","12","B1","Two-part","weder … noch","neither … nor","Connects equal elements","No verb negation needed (weder/noch already negate).","Ich mag weder Fisch noch Fleisch.","I like neither fish nor meat."],["","12","B1","Two-part","nicht nur … sondern auch","not only … but also","Connects equal elements","Emphasises an addition.","Sie ist nicht nur klug, sondern auch freundlich.","She is not only smart but also friendly."],["","12","B1","Two-part","zwar … aber","admittedly … but","Verb 2nd after 'zwar'","Concession + contrast.","Er ist zwar jung, aber sehr erfahren.","He is young, but very experienced."],["","12","B1","Two-part","einerseits … andererseits","on the one hand … on the other","Parts connect main clauses","Weighing arguments.","Einerseits ist die Stelle gut bezahlt, andererseits sind die Arbeitszeiten lang.","On the one hand the job pays well, on the other the hours are long."],["","12","B1","Two-part","je … desto / umso","the more … the more","je: verb last; desto: inversion","Comparatives in both parts.","Je mehr ich übe, desto besser spreche ich.","The more I practise, the better I speak."],["","12","B1","Connector adverb","daher / folglich","therefore / consequently","Position 1 – verb 2nd (inversion)","Consequence (more formal than deshalb).","Die Preise stiegen, daher kaufen viele weniger.","Prices rose, therefore many buy less."],["","12","B1","Connector adverb","dennoch / jedoch / allerdings","yet / however / though","Position 1 – verb 2nd (inversion)","Contrast (more formal than aber/trotzdem).","Der Plan ist gut, allerdings ist er teuer.","The plan is good, though it's expensive."],["","12","B1","Connector adverb","zudem / darüber hinaus","in addition / moreover","Position 1 – verb 2nd (inversion)","Adds a further argument (formal).","Die Wohnung ist günstig, zudem liegt sie zentral.","The flat is cheap; moreover it's central."],["","12","B1","Connector adverb","andernfalls / ansonsten","otherwise","Position 1 – verb 2nd (inversion)","Formal 'sonst'.","Bitte zahlen Sie, andernfalls müssen wir mahnen.","Please pay, otherwise we must send a reminder."],["","12","B1","Sequence adverb","zunächst / danach / schließlich","first / afterwards / finally","Position 1 – verb 2nd (inversion)","Structures a text or process.","Zunächst prüfen wir die Daten, schließlich präsentieren wir das Ergebnis.","First we check the data, finally we present the result."],["","19","B2","Subordinating","zumal","especially since","Nebensatz – verb LAST","Adds a strong extra reason.","Ich nehme den Job, zumal das Gehalt gut ist.","I'll take the job, especially since the pay is good."],["","19","B2","Connector adverb","folglich / infolgedessen / somit / demnach","consequently / hence / therefore","Position 1 – verb 2nd (inversion)","Logical consequence (formal).","Die Nachfrage sank, folglich fielen die Preise.","Demand fell, consequently prices dropped."],["","19","B2","Subordinating","obgleich / obschon / wenngleich","although (formal)","Nebensatz – verb LAST","Formal concession.","Obgleich er müde war, arbeitete er weiter.","Although he was tired he kept working."],["","19","B2","Subordinating","auch wenn / selbst wenn","even if","Nebensatz – verb LAST","Concession + condition.","Auch wenn es regnet, gehen wir wandern.","Even if it rains we go hiking."],["","19","B2","Connector adverb","nichtsdestotrotz / nichtsdestoweniger","nevertheless","Position 1 – verb 2nd (inversion)","Strong formal contrast.","Es gab Kritik; nichtsdestotrotz wurde das Projekt umgesetzt.","There was criticism; nevertheless the project went ahead."],["","20","B2","Subordinating","sofern / soweit","provided that / as far as","Nebensatz – verb LAST","Conditional; formal.","Sofern keine Einwände bestehen, beginnen wir morgen.","Provided there are no objections we start tomorrow."],["","20","B2","Subordinating","es sei denn (, dass)","unless","Nebensatz – verb LAST / verb 1st","Exception to a statement.","Wir gehen wandern, es sei denn, es regnet.","We'll go hiking unless it rains."],["","20","B2","Connector adverb","andernfalls / anderenfalls","otherwise","Position 1 – verb 2nd (inversion)","Formal 'sonst'.","Bitte melden Sie sich, andernfalls verfällt Ihr Anspruch.","Please get h bin in einem Park."],["Genitiv","Possession; after wegen, trotz, während, (an)statt, aufgrund…","","Das Auto eines Mannes. / Wegen eines Problems."],["3. Example sentences, level by level (A1 → B2)"],["Level","Form","Case","Gender","Trigger (why this case?)","Example (DE)","English","Dativ/Akkusativ note","Tip"],["A1","ein","Nominativ","masculine","Subject with sein: 'Das ist …'","Das ist ein Tisch.","That is a table.","No case trigger — just the subject.","Nominativ = the basic, 'dictionary' form of ein."],["A1","ein","Nominativ","neuter","Subject with sein","Das ist ein Kind.","That is a child.","Nominativ.","ein looks the same for masculine and neuter in Nominativ."],["A1","eine","Nominativ","feminine","Subject with sein","Das ist eine Lampe.","That is a lamp.","Nominativ.","eine is used for ALL feminine nouns, in Nom. and Akk."],["A1","ein","Akkusativ","neuter","Direct object (Wen? Was?) — verb haben","Ich habe ein Auto.","I have a car.","Akkusativ, but neuter looks the same as Nominativ.","Only masculine changes in Akkusativ — neuter/feminine stay the same."],["A1","eine","Akkusativ","feminine","Direct object — verb haben","Ich habe eine Schwester.","I have a sister.","Akkusativ, feminine unchanged."],["A1","einen","Akkusativ","masculine","Direct object — verb kaufen","Ich kaufe einen Apfel.","I'm buying an apple.","Akkusativ — masculine: ein → einen.","This is the ONE change to remember: der/ein → den/einen for masculine objects."],["A1","einen","Akkusativ","masculine","Direct object — verb brauchen","Ich brauche einen Stift.","I need a pen.","Akkusativ (masculine)."],["A1","ein","Akkusativ","neuter","Direct object — verb möchten","Ich möchte ein Eis.","I'd like an ice cream.","Akkusativ, neuter unchanged."],["A1","eine","Akkusativ","feminine","Direct object — verb trinken","Ich trinke eine Cola.","I'm drinking a cola.","Akkusativ, feminine unchanged."],["A1","ein","Nominativ/Akkusativ","masc/neut","es gibt + Akkusativ","Es gibt ein Problem.","There is a problem.","es gibt always takes Akkusativ, but masc./neut. look the same here.","With a masculine noun this WOULD change: Es gibt einen Park."],["A2","einem","Dativ","masculine","Indirect object (Wem?) — verb geben","Ich gebe einem Mann das Buch.","I'm giving a man the book.","Dativ — masculine: ein → einem.","Dativ = the person who receives something."],["A2","einer","Dativ","feminine","Indirect object — verb helfen (always Dativ!)","Ich helfe einer Frau.","I'm helping a woman.","Dativ — feminine: eine → einer.","helfen, danken, gefallen, gehören always take Dativ, even without an indirect + direct object pair."],["A2","einem","Dativ","neuter","Indirect object — verb schenken","Ich schenke einem Kind ein Buch.","I'm giving a child a book as a present.","Dativ (neuter) + Akkusativ (the book, neuter, unchanged).","Two objects: person = Dativ, thing = Akkusativ."],["A2","einem","Dativ","masculine","Dativ preposition 'mit'","Ich fahre mit einem Bus.","I'm going by bus.","Dativ — triggered by the preposition 'mit'.","aus, bei, mit, nach, seit, von, zu ALWAYS take Dativ."],["A2","einer","Dativ","feminine","Dativ preposition 'bei'","Ich wohne bei einer Freundin.","I'm staying at a friend's place.","Dativ — triggered by 'bei'."],["A2","einen","Akkusativ","masculine","Akkusativ preposition 'für'","Das ist ein Geschenk für einen Freund.","That's a gift for a friend.","Akkusativ — triggered by 'für'.","für, durch, gegen, ohne, um ALWAYS take Akkusativ."],["A2","einen","Akkusativ","masculine","Two-way preposition 'in' + movement (Wohin?)","Ich gehe in einen Park.","I'm going into a park.","Akkusativ — movement/direction (Wohin?).","Wo? = Dativ (location); Wohin? = Akkusativ (movement) — same preposition, different case."],["A2","einem","Dativ","masculine","Two-way preposition 'in' + location (Wo?)","Ich bin in einem Park.","I'm in a park.","Dativ — location, no movement (Wo?).","Compare with the row above: same sentence idea, different case."],["A2","einer","Dativ","feminine","Two-way preposition 'auf' + location","Das Buch liegt auf einer Tasche.","The book is lying on a bag.","Dativ — location (Wo?)."],["A2","einen","Akkusativ","masculine","Two-way preposition 'auf' + movement","Ich lege das Buch auf einen Tisch.","I'm putting the book on a table.","Akkusativ — movement (Wohin?)."],["A2","einen","Akkusativ","masculine","Modal verb + Akkusativ object","Ich möchte einen Kaffee bestellen.","I'd like to order a coffee.","Akkusativ — object of the modal sentence.","Modal verbs don't change the case; the main verb's object still needs its normal case."],["B1","einem","Dativ","masculine","Verb + fixed Dativ preposition — warten bei","Er wartet bei einem Freund.","He's waiting at a friend's place.","Dativ — 'bei' always Dativ."],["B1","einer","Dativ","feminine","Adjective + Dativ — Ich bin zufrieden mit …","Ich bin zufrieden mit einer Lösung.","I'm satisfied with a solution.","Dativ — 'mit' always Dativ.","Adjective + preposition combos (zufrieden mit, stolz auf) keep the preposition's normal case."],["B1","einen","Akkusativ","masculine","Verb + preposition — sich interessieren für","Ich interessiere mich für einen Kurs.","I'm interested in a course.","Akkusativ — 'für' always Akkusativ."],["B1","eines","Genitiv","masculine","Possession — 'wegen'","Wegen eines Problems kommt er später.","Because of a problem he'll come later.","Genitiv — 'wegen' triggers Genitiv (formal/written).","In speech many people say 'wegen einem Problem' (Dativ) — but Genitiv is correct in writing."],["B1","eines","Genitiv","neuter","Possession — noun phrase 'der Preis eines Autos'","Das ist der Preis eines Autos.","That is the price of a car.","Genitiv — shows possession/relationship.","Masculine & neuter nouns usually add -s or -es in the Genitiv too: eines Autos."],["B1","einer","Genitiv","feminine","Possession — 'der Titel einer Geschichte'","Das ist der Anfang einer Geschichte.","That is the beginning of a story.","Genitiv — feminine 'einer' (same form as Dativ!)."," kommen","bekommt","bekam","hat bekommen","to receive","A1"],["","beschreiben","beschreibt","beschrieb","hat beschrieben","to describe","B1"],["","erhalten","erhält","erhielt","hat erhalten","to receive (formal)","B1"],["","verschwinden","verschwindet","verschwand","ist verschwunden","to disappear","B1"],["","* sitzen/liegen/stehen: haben in northern Germany; sein in southern Germany, Austria & Switzerland. Mixed verbs (bringen, denken, kennen, nennen, rennen, wissen): vowel change + -te.","","","","",""]]},"Speaking Phrases":{"h":["Status","Week","Level","Situation","Phrases (DE)","English","Practice idea"],"r":[["","1","A1","Introducing yourself","Hallo, ich heiße … / Ich komme aus … / Ich wohne in … / Ich bin … Jahre alt. / Ich spreche ein bisschen Deutsch.","Hi, I'm called… / I'm from… / I live in… / I'm … years old. / I speak a little German.","Record a 30-second introduction."],["","1","A1","Greeting & goodbye","Guten Morgen / Guten Tag / Guten Abend. / Wie geht's? – Gut, danke. Und dir? / Tschüss! / Auf Wiedersehen!","Good morning/day/evening. / How are you? – Fine, thanks. And you? / Bye! / Goodbye!","Greet 5 people at different times of day."],["","1","A1","Ordering in a café","Ich möchte einen Kaffee, bitte. / Ich hätte gern ein Brötchen. / Was kostet das? / Zahlen, bitte.","I'd like a coffee, please. / I'd like a roll. / How much is it? / The bill, please.","Role-play with a partner."],["","2","A1","Asking for repetition","Wie bitte? / Können Sie das bitte wiederholen? / Bitte langsamer. / Ich verstehe nicht.","Pardon? / Could you repeat that? / Slower, please. / I don't understand.","Practise with a slow podcast."],["","2","A1","Time & appointments","Wie spät ist es? / Um wie viel Uhr? / Ich habe am Montag um 9 Uhr Zeit. / Passt Ihnen Dienstag?","What time is it? / At what time? / I have time on Monday at 9. / Does Tuesday suit you?","Make 3 appointments aloud."],["","2","A1","Directions","Entschuldigung, wo ist der Bahnhof? / Gehen Sie geradeaus, dann links. / Ist das weit?","Excuse me, where is the station? / Go straight, then left. / Is it far?","Give directions on a map."],["","3","A2","Talking about the weekend","Am Wochenende bin ich … gefahren. / Ich habe … gemacht. / Es war toll/langweilig.","At the weekend I went… / I did… / It was great/boring.","Tell 5 sentences about last weekend."],["","3","A2","At the train station / hotel","Eine Fahrkarte nach … , bitte. / Wann fährt der nächste Zug? / Ich habe ein Zimmer reserviert.","A ticket to…, please. / When does the next train leave? / I've reserved a room.","Role-play buying a ticket."],["","4","A2","Gifts & celebrations","Alles Gute zum Geburtstag! / Herzlichen Glückwunsch! / Das Geschenk gefällt mir sehr. / Danke für die Einladung.","Happy birthday! / Congratulations! / I really like the gift. / Thanks for the invitation.","Write 3 birthday messages."],["","4","A2","Describing a room","Der Tisch steht in der Mitte. / Das Bild hängt an der Wand. / Ich stelle das Sofa ans Fenster.","The table is in the middle. / The picture hangs on the wall. / I'll put the sofa by the window.","Describe your room aloud."],["","5","A2","At the doctor","Ich habe Kopfschmerzen / Fieber / Husten. / Mir tut der Rücken weh. / Wie oft soll ich die Tabletten nehmen?","I have a headache / fever / cough. / My back hurts. / How often should I take the tablets?","Role-play a doctor visit."],["","5","A2","Comparing & giving preferences","Ich finde … schöner als … / Am liebsten würde ich … / Das ist am besten.","I find … prettier than … / Most of all I'd like to … / That's the best.","Compare 3 options aloud."],["","6","A2","Restaurant (polite)","Ich hätte gern die Speisekarte. / Könnten wir bitte bestellen? / Das Essen war ausgezeichnet. / Die Rechnung, bitte.","I'd like the menu. / Could we order? / The food was excellent. / The bill, please.","Role-play a full restaurant visit."],["","7","A2","Phone call & appointment","Guten Tag, hier spricht … / Ich rufe wegen … an. / Könnte ich bitte Frau … sprechen? / Kann ich eine Nachricht hinterlassen?","Hello, this is … / I'm calling about… / Could I speak to Ms …? / Can I leave a message?","Make 3 practice calls."],["","7","A2","Formal email openings","Sehr geehrte Damen und Herren, … / Ich schreibe Ihnen wegen … / Vielen Dank im Voraus. / Mit freundlichen Grüßen","Dear Sir or Madam … / I'm writing to you about… / Thanks in advance. / Kind regards","Write a formal email."],["","8","B1","Giving reasons & concessions","Obwohl … / Ich habe mich dafür entschieden, weil … / Das liegt daran, dass … / Damit … / Da …","Although… / I decided because… / That's because… / So that… / Since…","Explain a decision in 5 sentences."],["","8","B1","Telling a story","Damals … / Als ich … war, … / Nachdem …, … / Plötzlich … / Am Ende …","Back then… / When I was… / After… / Suddenly… / In the end…","Tell a 1-minute story in Präteritum."],["","9","B1","Describing people/things","Das ist jemand, der … / Das ist etwas, das … / Die Stadt, in der ich wohne, …","That is someone who… / That is something that… / The city I live in…","Describe 5 objects w/o naming them."],["","10","B1","Explaining a process","Zuerst wird … / Dann wird … gemacht. / Am Ende wird … geprüft.","First … is done / Then … is made / In the end … is checked.","Describe a process in passive."],["","11","B1","Advice & wishes","An deiner Stelle würde ich … / Du solltest … / Wenn ich Zeit hätte, würde ich … / Ich wünschte, ich hätte …","If I were you I'd… / You should… / If I had time I'd… / I wish I had…","Give advice to 3 imaginary friends."],["","12","B1","Opinion & pros/cons","Meiner Meinung nach … / Einerseits …, andererseits … / Ich bin dafür/dagegen, weil … / Ein Vorteil ist …","In my opinion… / On the one hand… on the other… / I'm for/against because… / One advantage is…","Speak 2 minutes on 'Homeoffice'."],["","13","B1","Presentation","Ich möchte Ihnen heute … vorstellen. / Zuerst … dann … zum Schluss … / Vielen Dank für Ihre Aufmerksamkeit.","Today I'd like to present … / First… then… finally… / Thank you for your attention.","Give a 3-minute presentation."],["","15","B2","Reporting what others said","Er sagte, er sei … / Laut dem Bericht … / Sie behauptet, dass … / Wie berichtet wird, …","He said he was… / According to the report… / She claims that… / As reported…","Report 5 statements from a news item."],["","19","B2","Advanced argument","Zwar …, aber … / Dennoch … / Nichtsdestotrotz … / Dies führt dazu, dass … / Folglich …","Admittedly … but … / Nevertheless … / This leads to … / Consequently …","Argue a topic for 3 minutes."],["","22","B2","Hedging & careful speech","Ich würde sagen, dass … / Das dürfte stimmen. / Es scheint, dass … / Soweit ich weiß, …","I'd say that… / That is probably right. / It seems that… / As far as I know…","Answer 5 questions with hedging."],["","24","B2","Natural spoken reactions","Na ja, … / Eben! / Das ist halt so. / Komm doch mal vorbei! / Was denn?","Well… / Exactly! / That's just how it is. / Do drop by! / What (exactly)?","Watch a series, note 15 particles."],["","26","B2","Discussion moves","Da stimme ich Ihnen zu. / Das sehe ich anders. / Darf ich kurz einhaken? / Ich möchte noch hinzufügen, dass …","I agree with you. / I see that differently. / May I chime in? / I'd like to add that…","Debate for 10 minutes."],["","27","B2","Describing graphs","Die Grafik zeigt … / Der Anteil beträgt … Prozent. / Die Zahl ist um … gestiegen. / Im Vergleich zu … ist …","The graph shows… / The share is … percent. / The number rose by… / Compared to… is…","Describe 3 charts."],["","31","B2","Buying time & rephrasing","Das ist eine gute Frage. / Lassen Sie mich kurz überlegen. / Genauer gesagt, … / Mit anderen Worten, …","That's a good question. / Let me think briefly. / To be more precise… / In other words…","Practise with unexpected questions."],["","33","B2","Exam speaking (B2)","Ich möchte kurz zusammenfassen: … / Zum Abschluss möchte ich betonen, dass … / Zusammenfassend lässt sich sagen, …","I'd like to summarise briefly… / In closing I want to stress… / In summary…","Do a full mock speaking test."]]},"Job & HR":{"h":["Status","Level","Stage","Situation","HR / interviewer says (DE)","You say – key phrases (DE)","English","Grammar to use","Week","Practice"],"r":[["","A1","1 Job search & ads","Read a simple job ad","Wir suchen eine Verkäuferin (m/w/d), Vollzeit oder Teilzeit. Arbeitsbeginn: 1. März.","Vocabulary: die Stelle, der Job, Vollzeit, Teilzeit, der Chef, die Erfahrung, das Gehalt, bewerben.","We are looking for a sales assistant, full- or part-time. Start: March 1st.","Nouns + articles; numbers & dates","2","Find 5 ads and list 10 new words with article."],["","A1","2 Application (CV & cover letter)","Fill in an application form","Name, Vorname, Adresse, Telefonnummer, E-Mail, Geburtsdatum, Staatsangehörigkeit.","Mein Name ist …, das schreibt man M-Ü-L-L-E-R. Meine Telefonnummer ist …","My name is … spelled … My phone number is …","Alphabet; numbers; sein/heißen; possessive mein","1","Spell your name & email aloud 5 times."],["","A1","3 HR call (invitation / scheduling)","Answer an HR call","Guten Tag, hier spricht Frau Weber von der Firma Krause. Spreche ich mit Herrn …?","Ja, das bin ich. Guten Tag, Frau Weber. / Können Sie das bitte wiederholen? / Bitte langsamer.","Yes, that's me. Good day. / Could you repeat that? / Slower, please.","sein; polite Sie; modal können","1","Practise the phrases with a friend on the phone."],["","A1","3 HR call (invitation / scheduling)","Fix an appointment","Wann haben Sie Zeit? Passt Ihnen Montag um 10 Uhr?","Ich habe am Montag um 10 Uhr Zeit. / Leider nicht. Passt Dienstag? / Danke, auf Wiederhören!","I have time on Monday at 10. / Unfortunately not. Does Tuesday suit? / Thanks, goodbye!","am / um + time; days; haben","2","Book 3 imaginary appointments aloud."],["","A1","4 Screening call (phone interview)","Basic personal questions","Wie heißen Sie? Woher kommen Sie? Was sind Sie von Beruf? Sprechen Sie Deutsch?","Ich heiße … Ich komme aus … Ich bin … von Beruf. Ich spreche ein bisschen Deutsch und gut Englisch.","I'm called … I come from … I'm a … by profession. I speak a little German and good English.","W-questions; present tense; sein","1","Answer these 4 questions in 30 seconds."],["","A1","5 Job interview","Say how long you have worked","Haben Sie Erfahrung? Wie lange arbeiten Sie schon als …?","Ja, ich arbeite seit drei Jahren als Programmierer. / Nein, ich habe noch keine Erfahrung.","Yes, I've been working as a programmer for three years. / No, I have no experience yet.","seit + Dativ; present tense; kein/keine","2","Write 3 sentences about your work with 'seit'."],["","A1","7 First days & workplace","First day: find your way","Willkommen! Das ist Ihr Büro. Die Arbeit beginnt um 8 Uhr.","Wo ist die Toilette / die Kantine / mein Computer? Ich bin neu hier. Danke!","Where is the toilet / canteen / my computer? I'm new here. Thanks!","Wo? questions; time; es gibt","2","Label an office plan in German."],["","A2","1 Job search & ads","Understand job requirements","Wir erwarten: Berufserfahrung, Teamfähigkeit, gute Deutschkenntnisse. Wir bieten: flexible Arbeitszeiten, 30 Tage Urlaub.","Ich habe zwei Jahre Berufserfahrung. Ich arbeite gern im Team. Meine Deutschkenntnisse sind auf A2-Niveau.","I have two years' experience. I like working in a team. My German is at A2 level.","Perfekt/present; adjectives; Nom/Akk","7","Match 5 ads with your profile."],["","A2","2 Application (CV & cover letter)","Write the Lebenslauf (CV)","Persönliche Daten · Berufserfahrung · Ausbildung · Sprachkenntnisse · Weitere Kenntnisse.","2019–2023: Marketingassistent bei ABC GmbH, Berlin. 2015–2019: Studium der Wirtschaft, Universität Wien.","2019–2023: marketing assistant at ABC GmbH, Berlin. 2015–2019: business studies, University of Vienna.","Noun phrases; Perfekt for cover letter","6","Make a one-page CV in German."],["","A2","2 Application (CV & cover letter)","Short cover email","Bitte senden Sie Ihre Bewerbung per E-Mail an bewerbung@firma.de.","Sehr geehrte Damen und Herren, ich interessiere mich für die Stelle als … Ich habe drei Jahre als … gearbeitet. Anbei finden Sie meinen Lebenslauf. Mit freundlichen Grüßen","Dear Sir or Madam, I'm interested in the position as … I've worked three years as … Attached is my CV. Kind regards","Formal Sie; Perfekt; für + Akk","7","Write an email (80 words) for a real ad."],["","A2","3 HR call (invitation / scheduling)","Accept an interview invitation","Wir möchten Sie gern zu einem Vorstellungsgespräch einladen. Passt Ihnen Donnerstag, 14 Uhr?","Vielen Dank für die Einladung. Ja, das passt mir gut. / Leider habe ich da einen Termin. Könnte ich Freitag kommen?","Thanks for the invitation. Yes, that suits me well. / Unfortunately I have an appointment. Could I come Friday?","Dativ (mir); Konjunktiv II (könnte)","7","Roleplay 3 versions: accept, decline, propose."],["","A2","3 HR call (invitation / scheduling)","Ask for practical details","Das Gespräch findet im dritten Stock statt.","Könnten Sie mir bitte die Adresse schicken? Muss ich Unterlagen mitbringen? Ich komme mit dem Bus und bin pünktlich.","Could you send me the address? Do I have to bring documents? I'll come by bus and be on time.","Modal müssen; mit + Dativ; Konjunktiv II","7","Write 4 polite questions."],["","A2","4 Screening call (phone interview)","Tell me about yourself (short)","Erzählen Sie bitte kurz von sich.","Ich bin 28 Jahre alt und komme aus Polen. Ich habe Informatik studiert und danach zwei Jahre bei … als Entwickler gearbeitet. Jetzt suche ich eine neue Stelle, weil ich mich weiterentwickeln möchte.","I'm 28 and come from Poland. I studied computer science and then worked two years as a developer at … Now I'm looking for a new job because I want to develop further.","Perfekt; weil-clause; um…zu","5","Record a 45-second answer."],["","A2","5 Job interview","Why us?","Warum möchten Sie bei uns arbeiten?","Ich interessiere mich für Ihre Firma, weil sie international ist. Außerdem passt die Stelle gut zu meiner Erfahrung.","I'm interested in your company because it's international. Besides, the job fits my experience.","weil; außerdem; interessieren für + Akk","5","Write 3 reasons for 3 different firms."],["","A2","5 Job interview","Strengths","Was sind Ihre Stärken?","Ich bin zuverlässig, teamfähig und lerne schnell. Ich arbeite gern selbstständig.","I'm reliable, a team player and learn fast. I like working independently.","Adjectives (predicate); gern","6","Learn 10 strength adjectives."],["","A2","5 Job interview","Languages","Sprechen Sie Deutsch? Wie gut?","Ich spreche Deutsch auf A2-Niveau, aber ich lerne jeden Tag. Ich verstehe Fachbegriffe in meinem Bereich.","I speak German at A2 level, but I learn every day. I understand technical terms in my field.","Time expression; verbs","6","Prepare 2 sentences about your German level."],["","A2","5 Job interview","Ask questions","Haben Sie noch Fragen?","Wie sind die Arbeitszeiten? Gibt es Homeoffice? Wann bekomme ich eine Antwort?","What are the working hours? Is there home office? When will I get an answer?","W-questions; es gibt; Akk","7","Prepare 5 questions to ask."],["","A2","7 First days & workplace","Colleagues & help","Das ist Ihr Kollege Max, er hilft Ihnen.","Freut mich! Könnten Sie mir bitte zeigen, wie der Drucker funktioniert? Vielen Dank für Ihre Hilfe.","Nice to meet you! Could you show me how the printer works? Thanks for your help.","Dativ (mir/Ihnen); Konjunktiv II","4","Ask 5 polite questions at 'work'."],["","B1","1 Job search & ads","Analyse a full job ad","Ihre Aufgaben: Betreuung von Kunden. Ihr Profil: abgeschlossenes Studium. Wir bieten: eine unbefristete Stelle.","Ich erfülle die Anforderungen, denn ich habe … studiert und bringe drei Jahre Erfahrung in … mit.","I meet the requirements because I studied … and bring three years' experience in …","Nominal phrases; passive in ads; relative clauses","9","Highlight requirements and match them to your CV."],["","B1","2 Application (CV & cover letter)","Cover letter (Anschreiben)","—","Mit großem Interesse habe ich Ihre Anzeige gelesen. Ich bringe … Jahre Erfahrung im Bereich … mit. Über eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.","I read your ad with great interest. I bring … years' experience in … I would be delighted about an invitation to a personal interview.","Perfekt/Präteritum; Konjunktiv II; um…zu","12","Write a 200-word Anschreiben."],["","B1","3 HR call (invitation / scheduling)","HR call: availability","Sind Sie noch an der Stelle interessiert? Wann könnten Sie anfangen?","Ja, sehr. Ich habe eine Kündigungsfrist von drei Monaten. Ich könnte ab dem 1. Oktober anfangen.","Yes, very. I have a notice period of three months. I could start from October 1st.","Konjunktiv II; ab + Dativ; Nebensatz","11","Practise 3 different notice periods."],["","B1","4 Screening call (phone interview)","Career summary","Beschreiben Sie bitte Ihren bisherigen Werdegang.","Nach meinem Studium habe ich als Trainee bei … begonnen. Danach arbeitete ich fünf Jahre als …, wo ich für … verantwortlich war. Zuletzt habe ich ein Team von vier Personen geleitet.","After my studies I started as a trainee at … Then I worked five years as …, where I was responsible for … Recently I led a team of four.","Präteritum + Perfekt; relative clauses; nachdem","8","Record a 90-second Werdegang."],["","B1","4 Screening call (phone interview)","Why change jobs?","Warum möchten Sie Ihre Stelle wechseln?","Obwohl ich meine Arbeit mag, suche ich neue Herausforderungen, damit ich mich weiterentwickeln kann.","Although I like my job, I'm looking for new challenges so that I can develop further.","obwohl; damit; sich weiterentwickeln","8","Prepare 3 honest, positive reasons."],["","B1","4 Screening call (phone interview)","German level & work permit","Wie gut ist Ihr Deutsch? Haben Sie eine Arbeitserlaubnis?","Mein Deutsch entspricht dem Niveau B1; im Beruf kann ich Gespräche führen. Ich habe ein Visum, das bis … gilt.","My German is B1; at work I can hold conversations. I have a visa that is valid until …","Relative clause; bis + Akk/Dat","13","Prepare exact answers about visa & language level."],["","B1","5 Job interview","STAR-style example","Erzählen Sie von einem Projekt, das Sie erfolgreich abgeschlossen haben.","Situation: Wir hatten ein Problem mit … Meine Aufgabe war es, … Ich habe … organisiert und … eingeführt. Das Ergebnis war, dass die Kosten um 10 % sanken.","Situation: We had a problem with … My task was to … I organised and introduced … The result was that costs fell by 10%.","Präteritum, Perfekt, relative clauses, dass","10","Write 3 STAR stories (80 words each)."],["","B1","5 Job interview","Strengths & weaknesses","Was sind Ihre größten Stärken und Schwächen?","Meine größte Stärke ist meine Zuverlässigkeit. Eine Schwäche ist, dass ich manchmal zu perfektionistisch bin; daran arbeite ich, indem ich Prioritäten setze.","My greatest strength is reliability. A weakness is that I'm sometimes too perfectionist; I'm working on it by setting priorities.","dass; Nominalization; Konjunktiv II","11","Prepare 3 strengths + 1 weakness with an example."],["","B1","5 Job interview","Where in 5 years?","Wo sehen Sie sich in fünf Jahren?","Ich möchte mehr Verantwortung übernehmen und mein Fachwissen vertiefen. Wenn ich die Chance hätte, würde ich gern ein Team leiten.","I'd like to take on more responsibility and deepen my expertise. If I had the chance I'd like to lead a team.","Konjunktiv II; infinitive clauses","11","Answer in 1 minute."],["","B1","5 Job interview","Questions for the employer","Haben Sie noch Fragen an uns?","Wie sieht ein typischer Arbeitstag aus? Welche Entwicklungsmöglichkeiten gibt es? Wie ist das Team aufgebaut?","What does a typical day look like? What career opportunities are there? How is the team set up?","Indirect questions; passive","12","Prepare 6 questions."],["","B1","6 Salary & offer","Salary expectations","Was sind Ihre Gehaltsvorstellungen?","Ich stelle mir ein Jahresbruttogehalt von … Euro vor. Ich bin aber verhandlungsbereit.","I imagine an annual gross salary of … euros. But I'm open to negotiation.","sich vorstellen (Dativ reflexive); Akk","11","Research salary ranges for your role."],["","B1","6 Salary & offer","Follow-up email","—","Vielen Dank für das freundliche Gespräch am Dienstag. Ich freue mich auf Ihre Rückmeldung und stehe für Rückfragen gern zur Verfügung.","Thank you for the friendly conversation on Tuesday. I look forward to your reply and am glad to answer questions.","freuen auf + Akk; formal register","12","Write a follow-up email."],["","B1","6 Salary & offer","Accept the offer","Wir freuen uns, Ihnen die Stelle anzubieten.","Ich freue mich, Ihnen mitzuteilen, dass ich das Angebot gern annehme. Könnten Sie mir bitte den Arbeitsvertrag schicken?","I'm pleased to tell you that I gladly accept the offer. Could you send me the contract?","dass-clause; zu + Infinitiv","13","Write acceptance + decline versions."],["","B1","7 First days & workplace","Team introduction","Herzlich willkommen im Team!","Ich freue mich darauf, mit Ihnen zusammenzuarbeiten. Könnten Sie mir erklären, wie das System funktioniert?","I'm looking forward to working with you. Could you explain how the system works?","da-compounds; indirect questions","13","Introduce yourself to a 'new team' aloud."],["","B2","1 Job search & ads","Read contract & benefit terms","Die Probezeit beträgt sechs Monate. Der Urlaubsanspruch liegt bei 30 Tagen. Es gilt eine Kündigungsfrist von drei Monaten zum Monatsende.","Mir ist wichtig, dass die Regelungen zum Homeoffice schriftlich festgehalten werden.","The probation period is six months. Leave entitlement is 30 days. A notice period of three months to month-end applies.","Genitiv prepositions; Nominalstil; passive","21","Read a real Arbeitsvertrag sample; underline 20 terms."],["","B2","2 Application (CV & cover letter)","Persuasive Anschreiben","—","Aufgrund meiner mehrjährigen Erfahrung im Projektmanagement bin ich überzeugt, dass ich einen wertvollen Beitrag zu Ihrem Team leisten kann. Besonders reizt mich die Verbindung von Strategie und Umsetzung.","Due to my many years of project management experience I'm convinced I can make a valuable contribution to your team. I'm particularly attracted by the combination of strategy and execution.","aufgrund + Gen; dass; Nominalstil","25","Write & polish a 250-word Anschreiben."],["","B2","3 HR call (invitation / scheduling)","Negotiate logistics politely","Wir würden das Gespräch gern nächste Woche führen.","Wäre es möglich, das Gespräch auf Donnerstag zu verschieben? Bezüglich des Termins möchte ich anmerken, dass ich an diesem Tag verhindert bin.","Would it be possible to move the interview to Thursday? Regarding the date I'd like to mention that I'm unavailable that day.","Konjunktiv II; bezüglich + Gen","23","Role-play rescheduling."],["","B2","4 Screening call (phone interview)","Motivation & drivers","Was motiviert Sie an dieser Position?","Mich reizt vor allem die Kombination aus fachlicher Tiefe und Teamarbeit. Zudem sehe ich in Ihrem Unternehmen die Möglichkeit, langfristig Verantwortung zu übernehmen.","What attracts me most is the combination of expertise and teamwork. Moreover, I see the opportunity to take on responsibility long-term.","Advanced connectors; Nominalstil","19","Prepare 3 motivations in different wording."],["","B2","4 Screening call (phone interview)","Stress & priorities","Wie gehen Sie mit Stress und Zeitdruck um?","Indem ich Prioritäten setze und Aufgaben delegiere, behalte ich den Überblick. Ich nehme mir gezielt Zeit für Pausen, damit meine Leistung stabil bleibt.","By setting priorities and delegating I keep the overview. I take deliberate breaks so that my performance stays stable.","indem; damit; sich (Dat) Zeit nehmen","22","Answer in 60 seconds with 1 example."],["","B2","5 Job interview","Conflict example","Erzählen Sie von einem Konflikt im Team und wie Sie ihn gelöst haben.","Als es zu einem Missverständnis kam, habe ich das direkte Gespräch gesucht. Rückblickend hätte ich früher eingreifen können, aber wir haben eine gemeinsame Lösung gefunden.","When a misunderstanding arose, I sought a direct conversation. In hindsight I could have intervened earlier, but we found a joint solution.","als; Konjunktiv II Vergangenheit; Perfekt","23","Prepare 2 conflict stories."],["","B2","5 Job interview","Hypothetical question","Was würden Sie tun, wenn ein Kunde sich beschwert und im Unrecht ist?","Ich würde zunächst zuhören und die Lage analysieren. Hätte ich mehr Informationen, würde ich eine Lösung vorschlagen, ohne dass der Kunde sein Gesicht verliert.","I'd first listen and analyse the situation. If I had more information I'd propose a solution without the customer losing face.","Konjunktiv II; Hätte ich…; ohne dass","23","Answer 5 'Was würden Sie tun, wenn…?' questions."],["","B2","5 Job interview","Self-presentation (2 min)","Stellen Sie sich bitte kurz vor.","Ich möchte mich kurz vorstellen: Mein beruflicher Werdegang lässt sich in drei Phasen gliedern. Erstens … zweitens … Zusammenfassend lässt sich sagen, dass ich Erfahrung mitbringe, die für diese Stelle relevant ist.","I'd like to introduce myself briefly: my career divides into three phases. First … second … In summary, I bring experience relevant to this position.","Text structure; passive alternatives (lässt sich)","31","Time a 2-minute pitch."],["","B2","5 Job interview","Explain a career gap","Ihr Lebenslauf zeigt eine Lücke im Jahr 2021.","Die Lücke erklärt sich dadurch, dass ich in Elternzeit war und mich parallel weitergebildet habe.","The gap is explained by my having been on parental leave while continuing training.","dadurch, dass; Perfekt; Nominal","18","Prepare a factual, confident explanation."],["","B2","5 Job interview","Report others' statements","Was sagt Ihr Vorgesetzter über Sie?","Mein Vorgesetzter sagte, ich sei sehr zuverlässig und habe das Team sicher geführt. Laut Zeugnis habe ich die Ziele übertroffen.","My manager said I was very reliable and led the team confidently. According to the reference I exceeded targets.","Konjunktiv I; laut + Dativ","15","Turn 5 references into indirect speech."],["","B2","5 Job interview","Full B2 mock interview","—","Combine: Selbstpräsentation → Werdegang → Motivation → STAR examples → Hypothetical → Gehalt → Fragen an das Unternehmen.","Full run-through of a real interview.","All B2 grammar","33","Record a 15-minute mock with a tutor."],["","B2","6 Salary & offer","Salary negotiation","Wir bieten Ihnen 60.000 Euro brutto.","Ausgehend von meiner Erfahrung und dem Marktniveau halte ich einen Betrag von 65.000 Euro für angemessen. Wäre eine Anpassung nach der Probezeit denkbar?","Based on my experience and market level I consider 65,000 euros appropriate. Would an adjustment after probation be possible?","ausgehend von; halten für + Akk; Konjunktiv II","33","Rehearse with a tutor as employer."],["","B2","6 Salary & offer","Benefits & conditions","Es gibt Homeoffice an zwei Tagen pro Woche.","Sofern nichts anderes vereinbart ist, würde ich gern ein Weiterbildungsbudget und eine flexible Arbeitszeitregelung schriftlich festhalten.","Unless otherwise agreed I'd like a training budget and flexible working hours put in writing.","sofern; würde gern; Passiv","20","List 5 negotiable items."],["","B2","6 Salary & offer","Resign (Kündigung)","—","Hiermit kündige ich mein Arbeitsverhältnis fristgerecht zum 31. Dezember. Ich bitte um eine schriftliche Bestätigung sowie um ein qualifiziertes Arbeitszeugnis.","I hereby terminate my employment on time as of December 31st. I ask for written confirmation and a qualified reference.","Formal register; um + Akk bitten","21","Write a formal Kündigung."],["","B2","7 First days & workplace","Meetings & opinions","Was halten Sie von diesem Vorschlag?","Da stimme ich Ihnen zu, allerdings sehe ich ein Risiko bei der Umsetzung. Darf ich kurz einhaken? Ich möchte noch hinzufügen, dass …","I agree, though I see a risk in the implementation. May I chime in? I'd like to add that …","Concession; modal particles; dass","26","Practise opinion phrases in a video call."],["","B2","7 First days & workplace","Present data","Präsentieren Sie bitte die Zahlen.","Die Grafik zeigt, dass der Umsatz um 12 % auf 4,5 Mio. Euro gestiegen ist. Im Vergleich zum Vorjahr entspricht das einem deutlichen Anstieg.","The chart shows revenue rose 12% to €4.5m. Compared to last year that's a clear increase.","um/auf + Akk; im Vergleich zu + Dat","27","Describe 3 charts from work."],["","B2","7 First days & workplace","Small talk with colleagues","Na, wie war dein Wochenende?","Ganz gut, danke! Wir waren halt am See. Und bei dir? Komm doch mal mit zum Mittagessen!","Pretty good, thanks! We were at the lake. And you? Come along to lunch sometime!","Modal particles (halt, doch, mal); du/Sie switch","24","Do 5 small-talk exchanges."],["","B2","7 First days & workplace","Performance review","Wie sehen Sie Ihre Entwicklung im letzten Jahr?","Ich würde mir wünschen, dass wir gemeinsam klare Ziele für das nächste Jahr festlegen. Rückblickend hätte ich mehr Verantwortung übernehmen können.","I'd like us to set clear goals for next year together. In hindsight I could have taken more responsibility.","Konjunktiv II; dass; Perfekt Konjunktiv II","31","Prepare a self-assessment."]]},"1000 Freq Words":{"h":["Status","Example Sentence (German)","English Meaning","Word Type","Grammar Rule / Effect"],"r":[["","Ich bin müde.","I","Pronoun (personal, 1st sing.)","Nom.; acc.: mich; dat.: mir. Verb ends in -e (ich mache)"],["","Kommst du heute?","you (informal, singular)","Pronoun (personal, 2nd sing.)","Nom.; acc.: dich; dat.: dir. Verb ends in -st (du machst)"],["","Er arbeitet in Berlin.","he / it (masculine)","Pronoun (personal, 3rd sing.)","Nom.; acc.: ihn; dat.: ihm. Verb ends in -t (er macht)"],["","Sie liest ein Buch.","she / it (feminine)","Pronoun (personal, 3rd sing.)","Nom. and acc.: sie; dat.: ihr. Verb ends in -t (sie macht)"],["","Es ist kalt.","it (neuter)","Pronoun (personal, 3rd sing.)","Nom. and acc.: es; dat.: ihm. Also dummy subject (es regnet)"],["","Wir gehen nach Hause.","we","Pronoun (personal, 1st plural)","Nom.; acc. and dat.: uns. Verb = infinitive form (wir machen)"],["","Ihr seid sehr nett.","you (informal, plural)","Pronoun (personal, 2nd plural)","Nom.; acc. and dat.: euch. Verb ends in -t (ihr macht)"],["","Sie kommen morgen.","they","Pronoun (personal, 3rd plural)","Nom. and acc.: sie; dat.: ihnen. Verb = infinitive form (sie machen)"],["","Wie heißen Sie?","you (formal, sing. and plural)","Pronoun (personal, formal)","Always capitalized; acc.: Sie; dat.: Ihnen. Verb = infinitive form"],["","Er sieht mich.","me (accusative)","Pronoun (personal, acc.)","Accusative of ich; also reflexive (ich freue mich)"],["","Das Buch gehört mir.","me / to me (dative)","Pronoun (personal, dat.)","Dative of ich; used after helfen, gefallen, gehören etc."],["","Ich liebe dich.","you (accusative, informal)","Pronoun (personal, acc.)","Accusative of du; also reflexive (du freust dich)"],["","Ich helfe dir.","you / to you (dative, informal)","Pronoun (personal, dat.)","Dative of du"],["","Ich kenne ihn.","him / it (accusative)","Pronoun (personal, acc.)","Accusative of er (masc. nouns as \"it\")"],["","Ich gebe ihm das Buch.","him / to him (dative)","Pronoun (personal, dat.)","Dative of er and es"],["","Er hilft uns.","us / ourselves","Pronoun (personal, acc./dat.)","Accusative and dative of wir; also reflexive"],["","Ich sehe euch morgen.","you / yourselves (informal plural)","Pronoun (personal, acc./dat.)","Accusative and dative of ihr; also reflexive"],["","Ich danke ihnen.","them / to them (dative)","Pronoun (personal, dat.)","Dative of sie (they); formal \"Ihnen\" is capitalized"],["","Kann ich Ihnen helfen?","you / to you (formal dative)","Pronoun (personal, dat.)","Dative of formal Sie; always capitalized"],["","Er wäscht sich.","himself / herself / themselves","Pronoun (reflexive)","3rd person reflexive (acc. and dat.); goes with reflexive verbs (sich freuen)"],["","Man kann hier gut essen.","one / you / people (generic)","Pronoun (indefinite)","Always takes 3rd person singular verb; never used as \"man\" (male)"],["","Das ist mein Haus.","my","Possessive determiner","Takes endings like ein-: meine, meinen, meinem, meiner"],["","Wo ist dein Auto?","your (informal singular)","Possessive determiner","Endings like ein-: deine, deinen, deinem"],["","Sein Bruder ist Arzt.","his / its","Possessive determiner","Endings like ein-: seine, seinen, seinem. (Also the verb \"to be\")"],["","Ihre Mutter kocht gern.","her / their","Possessive determiner","Endings like ein-: ihre, ihren, ihrem"],["","Unser Haus ist klein.","our","Possessive determiner","Endings like ein-: unsere, unseren; the -e of -er often drops (unsren)"],["","Wo ist euer Lehrer?","your (informal plural)","Possessive determiner","Endings like ein-; eure, euren (the -e before -r drops)"],["","Wie ist Ihr Name?","your (formal)","Possessive determiner","Always capitalized; endings like ein-: Ihre, Ihren"],["","Der Mann ist nett.","the (masc. nominative)","Article (definite)","Masc. nom.; also fem. dat./gen. and plural gen.; also relative pronoun \"who/which\""],["","Die Frau lacht.","the (fem. / all plurals)","Article (definite)","Fem. nom./acc. and plural nom./acc.; also relative pronoun"],["","Das Kind spielt.","the (neuter) / that","Article (definite) / Pronoun","Neuter nom./acc.; also demonstrative \"that\"; conjunction dass is spelled with -ss"],["","Ich sehe den Hund.","the (masc. acc. / plural dat.)","Article (definite)","Masc. accusative; plural dative (noun adds -n: den Kindern)"],["","Ich helfe dem Mann.","the (masc./neuter dative)","Article (definite)","Dative masc./neuter (used after mit, bei, von, zu, nach, aus...)"],["","Das Auto des
