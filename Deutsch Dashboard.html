$('#items').innerHTML=g[1].map(n=>`<button class="pill s ${n===cur?'on':''}" data-t="${e(n)}">${e(n)}</button>`).join('')}
function go(n){cur=n;nav();if(n==='Home')home();else if(n==='Roadmap')roadmap();else if(RAW.includes(n))raw(n);else tbl(n);scrollTo(0,0)}
const w=r=>L('rm:'+r[0],r[17]||SL[0]);
const wt=s=>s==='Done'?1:s==='In progress'?.5:0;
function home(){const R=D.Roadmap.r,sh=D['Start Here'].r;const bars=[];let hd=0,ht=0,wd=0;
const ph=[['A1',1,2],['A2',3,7],['B1',8,13],['B2',14,33]].map(([n,a,b])=>{let t=0,d=0,c=0;R.filter(r=>+r[0]>=a&&+r[0]<=b).forEach(r=>{const h=+r[15]||0,x=wt(w(r));t+=h;d+=h*x;c+=x});hd+=d;ht+=t;wd+=c;return `<p><b>${n}</b> · weeks ${a}–${b} · ${Math.round(d)}/${t} h<span class="pb"><i style="width:${t?d/t*100:0}%"></i></span></p>`}).join('');
const nx=R.find(r=>w(r)!=='Done');
let lt=0,ld=0;const ls=Object.keys(CFG).map(n=>{const t=D[n].r.length,d=D[n].r.filter((_,i)=>L(n+':'+i)).length;lt+=t;ld+=d;return `<p>${e(n)} <span class="mu">${d}/${t}</span><span class="pb"><i style="width:${d/t*100}%"></i></span></p>`}).join('');
const tx=sh.filter(r=>/^(Month|After Month)/.test(r[0]));const tips=sh.filter(r=>r[0].startsWith('•'));
$('#sub').textContent=sh[0][0];
$('#main').innerHTML=`<p class="mu">${e(sh[1][0])}</p><div class="grid"><div class="tile"><b>${wd}/33</b><span>weeks completed</span></div><div class="tile"><b>${Math.round(hd)}/${ht}</b><span>study hours</span></div><div class="tile"><b>${ld}</b><span>items learned (of ${lt})</span></div></div>
${nx?`<div class="card sec"><h2>👉 Up next · Week ${nx[0]} (${nx[1]})</h2><b>${e(nx[2])}</b><p>🎯 ${e(nx[13])}</p><p class="mu">${e(nx[14])}</p><button class="btn pri" data-t="Roadmap">Open roadmap</button></div>`:'<div class="card sec"><h2>🎉 All weeks done!</h2></div>'}
<div class="card sec"><h2>Plan progress</h2>${ph}</div>
<div class="card sec"><h2>3-month plan</h2>${tx.map(r=>`<p><b>${e(r[0])}</b><br>${e(r[1])}</p>`).join('')}</div>
<div class="card sec"><h2>Vocabulary &amp; grammar learned</h2><div class="mu">Tick items in each tab to track them.</div>${ls}</div>
<div class="card sec"><h2>How to study</h2>${tips.map(r=>`<p>${e(r[0])}</p>`).join('')}</div>`}
const chips=r=>['N','A','D','G'].map((c,i)=>r[5+i]?`<span class="c ${r[5+i]==='✔'?'':'o'}" style="color:var(--${c})">${c}</span>`:'').join('');
function roadmap(){const s=st0('Roadmap'),lv=[...new Set(D.Roadmap.r.map(r=>r[1]))];
$('#main').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Search weeks, topics…" value="${e(s.q)}"><select data-f="1"><option value="">All levels</option>${lv.map(o=>`<option ${s.f[1]===o?'selected':''}>${o}</option>`).join('')}</select></div><p class="mu">N/A/D/G = Nominativ, Akkusativ, Dativ, Genitiv (filled = main focus, faded = light exposure)</p><div id="list"></div>`;rmList()}
function rmList(){const s=S.Roadmap,q=s.q.toLowerCase();
$('#list').innerHTML=D.Roadmap.r.filter(r=>(!s.f[1]||r[1]===s.f[1])&&(!q||r.join(' ').toLowerCase().includes(q))).map(r=>{const f=(l,v)=>v?`<p><i>${l}</i>${e(v)}</p>`:'';
return `<details class="card"><summary><span class="tag">W${r[0]} · ${r[1]}</span><div><b>${e(r[2])}</b><span>${chips(r)} ${e(r[10])}</span></div><span class="tag badge">${w(r)}</span></summary><div class="kv">${f('🎯 Goal',r[13])}${f('Topics',r[3])}${f('Grammar',r[4])}${f('Case note',r[9])}${f('Vocabulary',r[10])}${f('Skills',r[11])}${f('Job German',r[12])}${f('Practice tasks',r[14])}${f('Hours',r[15])}
<p><i>Status</i><select data-rs="${r[0]}">${SL.map(o=>`<option ${w(r)===o?'selected':''}>${o}</option>`).join('')}</select></p><p><i>My notes</i><textarea rows="2" data-rn="${r[0]}">${e(L('rn:'+r[0],''))}</textarea></p></div></details>`}).join('')}
function rows(n){const s=S[n],q=s.q.toLowerCase(),d=D[n];return d.r.map((_,i)=>i).filter(i=>{const r=d.r[i];for(const k in s.f)if(s.f[k]&&r[k]!==s.f[k])return false;if(s.lo&&L(n+':'+i))return false;return !q||r.join(' ').toLowerCase().includes(q)})}
function tbl(n){const d=D[n],s=st0(n),fc=[];
d.h.forEach((x,i)=>{if(FC.includes(x)){const v=[...new Set(d.r.map(r=>r[i]).filter(Boolean))];if(v.length>1&&v.length<=40){if(x==='Week')v.sort((a,b)=>a-b);fc.push([i,x,v])}}});
$('#main').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Search ${e(n)}…" value="${e(s.q)}">${fc.map(([i,x,v])=>`<select data-f="${i}"><option value="">${x}: all</option>${v.map(o=>`<option ${s.f[i]===o?'selected':''}>${e(o)}</option>`).join('')}</select>`).join('')}<label class="mu"><input type="checkbox" id="lo" ${s.lo?'checked':''}> hide learned</label><button class="btn pri" id="fc">▶ Flashcards</button></div><div id="meter"></div><div id="list"></div>`;list(n)}
function meter(n){const t=D[n].r.length,d=D[n].r.filter((_,i)=>L(n+':'+i)).length;$('#meter').innerHTML=`<div class="mu">${d} / ${t} learned</div><div class="pb"><i style="width:${d/t*100}%"></i></div>`}
function list(n){const d=D[n],c=CFG[n],s=S[n],ix=rows(n);meter(n);
$('#list').innerHTML=ix.slice(0,s.lim).map(i=>{const r=d.r[i],lv=r[d.h.indexOf('Level')];
return `<details class="card"><summary><input type="checkbox" data-l="${n}:${i}" ${L(n+':'+i)?'checked':''}><div><b>${e(c.t.map(k=>r[k]).filter(Boolean).join(' '))}</b><span>${e(r[c.s])}</span></div>${lv?`<span class="tag">${e(lv)}</span>`:''}</summary><div class="kv">${d.h.map((h,k)=>r[k]&&k&&!c.t.includes(k)&&k!==c.s?`<p><i>${e(h)}</i>${e(r[k])}</p>`:'').join('')}</div></details>`}).join('')+(ix.length>s.lim?`<button class="btn" data-more="1">Show more (${ix.length-s.lim} left)</button>`:'')||'<p class="mu">No matches.</p>'}
function raw(n){const s=st0(n);$('#main').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Search ${e(n)}…" value="${e(s.q)}"></div><div id="list"></div>`;rawList(n)}
function rawList(n){const s=S[n],q=s.q.toLowerCase();let o='',t=0,k=0;
for(const r of D[n].r){if(q&&!r.join(' ').toLowerCase().includes(q))continue;if(++k>400)break;
if(r.filter(Boolean).length<2){if(t){o+='</table></div>';t=0}o+=`<h3>${e(r[0])}</h3>`}else{if(!t){o+='<div class="sc"><table>';t=1}o+='<tr>'+r.map(c=>`<td>${e(c)}</td>`).join('')+'</tr>'}}
$('#list').innerHTML=o+(t?'</table></div>':'')}
function deck(n){let ix=rows(n).filter(i=>!L(n+':'+i));if(!ix.length)ix=rows(n);fc={n,ix:ix.sort(()=>Math.random()-.5),p:0,f:0};showFc()}
function showFc(){const m=$('#modal');m.hidden=false;
if(fc.p>=fc.ix.length){m.innerHTML='<div class="fcw"><h2>🎉 Deck finished!</h2><button class="btn pri" data-x="1">Close</button></div>';return}
const{n,ix,p,f}=fc,d=D[n],c=CFG[n],r=d.r[ix[p]];
m.innerHTML=`<div class="fcw"><div class="mu">${p+1} / ${ix.length}</div><div class="fcard" data-flip="1"><div class="big">${e(f?r[c.s]:c.t.map(k=>r[k]).filter(Boolean).join(' '))}</div>${f?d.h.map((h,k)=>r[k]&&k&&!c.t.includes(k)&&k!==c.s&&r[k].length<140?`<p>${e(h)}: ${e(r[k])}</p>`:'').join(''):'<p>tap to reveal</p>'}</div><div class="row" style="justify-content:center"><button class="btn" data-a="again">↻ Again</button><button class="btn pri" data-a="got">✓ Got it</button></div><p><button class="btn" data-x="1">Close</button></p></div>`}
const upd=()=>cur==='Roadmap'?rmList():RAW.includes(cur)?rawList(cur):list(cur);
document.addEventListener('click',ev=>{const t=ev.target,g=k=>t.closest(`[${k}]`);let x;
if(x=g('data-g'))go(G.find(a=>a[0]===x.dataset.g)[1][0]);
else if(x=g('data-t'))go(x.dataset.t);
else if(g('data-x')){$('#modal').hidden=true;if(cur!=='Home')upd();else home()}
else if(g('data-flip')){fc.f=1;showFc()}
else if(x=g('data-a')){if(x.dataset.a==='got')st.set(fc.n+':'+fc.ix[fc.p],'1');else fc.ix.push(fc.ix[fc.p]);fc.p++;fc.f=0;showFc()}
else if(g('data-more')){S[cur].lim+=60;list(cur)}
else if(t.id==='fc')deck(cur)});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.l){st.set(d.l,t.checked?'1':'');meter(d.l.split(':')[0])}
else if(d.rs){st.set('rm:'+d.rs,t.value);t.closest('details').querySelector('.badge').textContent=t.value}
else if(d.rn)st.set('rn:'+d.rn,t.value);
else if(d.f!=null){S[cur].f[d.f]=t.value;S[cur].lim=60;upd()}
else if(t.id==='lo'){S[cur].lo=t.checked;upd()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S[cur].q=ev.target.value;S[cur].lim=60;upd()}});
go('Home');
</script></body></html>
