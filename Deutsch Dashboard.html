<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-top:5px solid;border-image:linear-gradient(90deg,#111 33%,#dd0000 33% 66%,#ffce00 66%) 1;padding:14px 16px 4px;max-width:960px;margin:auto}

nav{max-width:960px;margin:auto;padding:6px 12px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#items{overflow-x:auto;flex-wrap:nowrap;padding:6px 0}
.pill,.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.pill.s{font-size:13px;padding:4px 11px}.pill.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:960px;margin:auto;padding:8px 12px 40px}
.card,.tile{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin:8px 0}
.card>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px}.card>summary::-webkit-details-marker{display:none}
.card summary div{flex:1;min-width:0}.card summary b{display:block;overflow-wrap:anywhere}.card summary span{color:var(--mu);font-size:13px}
.kv{padding:2px 14px 12px;border-top:1px solid var(--bd)}.kv p{margin:7px 0;overflow-wrap:anywhere}.kv i{font-style:normal;color:var(--mu);font-size:12px;text-transform:uppercase;display:block}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;color:var(--mu);white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}input[type=search],select,textarea{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:7px 10px;font:inherit}
input[type=search]{flex:1;min-width:150px}textarea{width:100%;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.tile{padding:12px;margin:0}.tile b{font-size:24px;display:block}.tile span{color:var(--mu);font-size:13px}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:var(--ac)}
.sec{padding:12px;margin:12px 0}.sec h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.c{display:inline-block;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;font-size:11px;font-weight:700;border:2px solid;margin-right:2px}.c.o{opacity:.4}
table{border-collapse:collapse;width:100%}td{border:1px solid var(--bd);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}.sc{overflow-x:auto;margin:6px 0}
h3{margin:16px 0 4px;font-size:15px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#modal[hidden]{display:none}
.fcw{background:var(--bg);border-radius:16px;padding:18px;width:min(460px,100%);max-height:90%;overflow:auto;text-align:center}
.fcard{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:28px 16px;margin:12px 0;min-height:160px;cursor:pointer}.fcard .big{font-size:24px;font-weight:600;overflow-wrap:anywhere}.fcard p{font-size:13px;color:var(--mu);margin:6px 0}

,"Partizip I (das lachende Kind) & Partizip II (das gelesene Buch) as adjectives with endings; extended participial phrases (die von vielen besuchte Stadt); zu + Partizip I (die zu lösende Aufgabe)","✔","✔","✔","✔","Normal adjective endings apply to participles.","Formal writing","Reading (news/academic)","Formal written style for reports/emails (participle attributes).","I can decode and produce extended participle phrases.","Unpack 10 complex noun phrases into relative clauses.","12","Next level – start after your B1 exam","Not started","",""],["18","B2","Nominalstil & Funktionsverbgefüge","Business, formal & official language; report writing","Nominalisation (entscheiden → die Entscheidung); Nebensatz → Präpositionalphrase (weil → wegen + Gen; obwohl → trotz + Gen; wenn → bei + Dat; nachdem → nach + Dat); Funktionsverbgefüge (in Betracht ziehen, Kritik üben, zur Verfügung stellen, in Frage stellen)","","○","✔","✔","Nominal style uses Genitiv & Dativ prepositions heavily.","Business & economy","Writing (formal)","Business/official style: Nominalstil, Funktionsverbgefüge.","I can shift between verbal (spoken) and nominal (formal written) style.","Convert 10 spoken-style sentences to formal nominal style.","12","Next level – start after your B1 exam","Not started","",""],["19","B2","Advanced connectors I: cause, consequence, concession, purpose","Analysing problems and solutions; societal issues","Kausal: da, zumal, nämlich; Konsekutiv: sodass, so…dass, folglich, infolgedessen, somit, demnach; Konzessiv: obgleich, obschon, wenngleich, auch wenn, dennoch, nichtsdestotrotz; Final: damit, um…zu, zu diesem Zweck","","","","○","Connector week (trotz/aufgrund + Genitiv).","Society problems & solutions","Writing","Argue your case (advanced connectors: cause, concession).","I can build complex reasoning with advanced connectors.","Write a 200-word problem–solution text with ≥ 12 advanced connectors.","12","Next level – start after your B1 exam","Not started","",""],["20","B2","Advanced connectors II: condition, manner, contrast, time","Rules, conditions, comparisons; formal discussions","Konditional: falls, sofern, soweit, es sei denn, vorausgesetzt (dass), andernfalls, je nachdem; Modal: indem, dadurch dass, ohne dass, (an)statt dass; Adversativ: während, wohingegen, hingegen; Temporal: solange, sooft, ehe, seitdem, währenddessen, anschließend; Additiv: zudem, ferner, überdies","","","","","Connector week.","Conditions & rules","Writing + Speaking","Negotiate conditions (falls, sofern, es sei denn).","I can express fine differences of condition, manner, contrast and time.","Combine 8 simple sentence pairs with 8 different connectors from this list.","12","Next level – start after your B1 exam","Not started","",""],["21","B2","Genitive prepositions & formal register","Law & administration; official texts; contracts","Advanced Genitiv prepositions (aufgrund, angesichts, anlässlich, infolge, mithilfe, mittels, anhand, hinsichtlich, bezüglich, zugunsten, seitens, ungeachtet, zwecks); Dativ/Genitiv alternatives (dank, laut + Dat; gemäß, entsprechend + Dat); Genitiv verbs & adjectives (bedürfen, gedenken; einer Sache bewusst/würdig)","","○","✔","✔","Formal German is Genitiv-heavy – exams love it.","Law & administration","Reading (official texts)","Read contracts & official texts (Genitiv prepositions).","I can read/write formal official language with correct cases.","Read an excerpt of a contract or Amtsbrief; underline all Genitiv structures.","12","Next level – start after your B1 exam","Not started","",""],["22","B2","Verbs, adjectives & nouns with prepositions (advanced)","Work-life balance, psychology & well-being; discussing attitudes","Advanced verb+prep (verzichten auf, beruhen auf, leiden unter, sich beziehen auf, hinweisen auf, abhängen von); adjective+prep (stolz auf, angewiesen auf, zufrieden mit, typisch für); noun+prep (Interesse an, Angst vor, Einfluss auf); da-compounds anticipating Nebensätze (Ich bestehe darauf, dass…)","","✔","✔","","Each pair fixes Akk or Dat – sheet 'Verb+Preposition'.","Work-life balance","Speaking + Writing","Strengths & weaknesses, work-life balance answers.","I can use B2 verb/adjective/noun + preposition patterns with correct case.","Make 50 sentence cards; write a 150-word opinion on work-life balance using 10 pairs.","12","Next level – start after your B1 exam","Not started","",""],["23","B2","Advanced Konjunktiv II & irreal comparisons","Hypothetical debates; ethics; regrets & missed chances","als ob/als wenn + KII; conditional without wenn (Hätte ich Zeit, würde ich…); irrealer Wunsch (Hätte ich doch…); KII past with modals (Ich hätte kommen können/sollen); fast/beinahe + KII; careful register (Ich würde sagen…; Das dürfte stimmen)","","","","","Mood week.","Ethics & hypotheticals","Speaking (monologue)","Hypotheticals: 'Wenn ich die Stelle bekäme…' (Konjunktiv II).","I can discuss hypothetical/unreal situations with nuance.","Record a 3-minute monologue 'What would have happened if…'.","12","Next level – start after your B1 exam","Not started","",""],["24","B2","Modal particles & subjective modal verbs","Natural spoken German; TV series/podcast listening; colloquial expressions","Subjective modals (Er muss/dürfte/könnte krank sein; Sie soll reich sein; Er will es nicht gewusst haben); modal + Perfekt infinitive; particles (ja, doch, mal, eben/halt, denn, wohl, eigentlich, schon, aber, bloß/nur, ruhig, vielleicht, etwa)","","","","","Spoken-language week.","Colloquial spoken German","Listening + Speaking","Sound natural with colleagues (modal particles, small talk).","I can sound natural and interpret nuances in speech.","Watch 10 min of a German series with subtitles; collect 15 modal-particle examples.","12","Next level – start after your B1 exam","Not started","",""],["25","B2","Register, formal writing & applications","Formal letters, applications (Bewerbung), CV, official emails, complaints","Register shift formal ↔ informal (bekommen → erhalten; fragen → sich erkundigen); Bezug nehmen auf + Akk; polite KII (Ich wäre Ihnen dankbar, wenn…); structure of Anschreiben & Lebenslauf; passive & nominal style","","○","○","","Fixed formal phrases carry their own case (Bezug nehmen auf + Akk).","Applications & bureaucracy","Writing (formal)","Write a full Bewerbung (Anschreiben + Lebenslauf).","I can write a convincing application and formal complaint.","Write a Bewerbungsanschreiben (200 words) for a real job ad.","12","Next level – start after your B1 exam","Not started","",""],["26","B2","Argumentation & discussion skills","Debates on society, ethics & politics; agreement/disagreement; structured argument","Argument structure (These – Argument – Beispiel – Schlussfolgerung); concession (Zwar…, aber…); hedging (Es scheint, dass…); dass-/ob-clauses after opinion verbs; nominal phrases for evaluation","","","","","Discourse week.","Society & ethics debates","Speaking (debate)","Debate & justify decisions in team meetings.","I can lead and take part in a fluent discussion.","Debate a topic with a language partner for 10 minutes; record & self-evaluate.","12","Next level – start after your B1 exam","Not started","",""],["27","B2","Describing graphs & trends","Statistics, economy, research results; presentations with charts","Trend verbs (steigen, sinken, zunehmen, abnehmen, stagnieren, schwanken); prepositions with numbers: um + Akk, auf + Akk, von…auf, zwischen…und, im Vergleich zu + Dat, gegenüber + Dat; Anteil, Prozent, Hälfte, doppelt so…wie","","○","○","","um/auf + Akk, im Vergleich zu/gegenüber + Dat.","Data & trends","Writing + Speaking","Present KPIs & charts in meetings.","I can describe a chart and interpret data.","Describe 3 charts from Statista/Destatis (100 words each).","12","Next level – start after your B1 exam","Not started","",""],["28","B2","Idioms, collocations & word formation","Language, culture & humour; dialects & regional variation (Germany/Austria/Switzerland)","Idioms & proverbs; verb–noun collocations; compound nouns & derivation; separable/inseparable prefixes with meaning change (übersetzen, umfahren, durchschauen); Austrian & Swiss variants","","","","","Vocabulary week.","Language & culture","Reading + Listening","Idioms in office small talk.","I can understand and use common idioms and collocations.","Collect 30 idioms with equivalents in your language; use 10 in a short text.","12","Next level – start after your B1 exam","Not started","",""],["29","B2","Advanced listening & reading; text cohesion","News, podcasts, lectures, articles; note-taking; summarising","Textkohäsion: da-/hier-compounds (dabei, dafür, hierzu, hierbei); demonstratives (dieser, jener, ersterer/letzterer); pronominal substitution; summarising in KI; skimming vs. scanning","","","","","Reading/listening week.","Current affairs","Reading + Listening","Follow industry news; summarise for colleagues.","I can follow news, lectures and long articles.","Read 1 Zeit/Spiegel article per day for a week; summarise each in 5 sentences.","12","Next level – start after your B1 exam","Not started","",""],["30","B2","Writing at B2: Erörterung, Leserbrief, Kommentar","Environment & sustainability; structured essays and letters; discussion posts","Vorfeld/Mittelfeld/Nachfeld, topic fronting; order of elements (TeKaMoLo; pronoun before noun; Dat before Akk); text-structure connectors; paragraphs; opinion vs. neutral style","○","○","○","○","Mittelfeld order relies on all four cases.","Environment & sustainability","Writing","Write formal opinion/complaint emails.","I can write a well-structured opinion essay/letter.","Write a 250-word Leserbrief/Erörterung; get corrections from a tutor/exchange partner.","12","Next level – start after your B1 exam","Not started","",""],["31","B2","Speaking at B2 & modality verbs","Work & future; spontaneous discussion, presenting, mediation (Sprachmittlung)","Modality verbs (scheinen, pflegen, drohen, versprechen, brauchen + zu); lassen (3 uses); haben/sein + zu + Inf; ellipsis; reformulation phrases (das heißt, mit anderen Worten)","","○","","","Object cases as usual.","Work & future","Speaking","Spontaneous discussion; B2 interview Q&A.","I can speak fluently and spontaneously on a broad range of topics.","Give a 5-minute monologue on 'My job in 10 years' and a 5-minute discussion with a partner/tutor.","12","Next level – start after your B1 exam","Not started","",""],["32","B2","Grammar mega-review","Consolidation of all cases, declension, tenses, word order, connectors","All 4 cases (articles, pronouns, adjective endings, prepositions, verbs); tenses & moods; passive & alternatives; relative clauses; subordinate/inversion rules; error correction","✔","✔","✔","✔","Complete case consolidation.","Academic verbs & high-frequency B2","Grammar + Writing","Grammar polish: make emails error-free.","I can self-correct systematically.","Do 3 grammar tests (e.g., Goethe B2 practice sets); update your error log.","12","Next level – start after your B1 exam","Not started","",""],["33","B2","B2 mock exams & next steps","Goethe-Zertifikat B2 / telc B2 / ÖSD B2 mock exams; final speaking assessment; plan for C1","Exam strategies for Lesen, Hören, Schreiben, Sprechen; time management; useful phrases","","","","","Exam week.","Exam vocabulary","All four skills (mock exams)","Full B2 mock interview & salary negotiation.","I can pass B2 and plan my C1 path.","Take 2 full mock exams; book the real exam; plan C1 (novels, Aspekte neu C1, podcasts).","12","Next level – start after your B1 exam","Not started","",""]]},"W - Questions":{"h":["Level","Week","Category","W-word / phrase","Meaning","Case","Example (DE)","English","Rule / how it works","Tip / watch out"],"r":[["A1","1","Person","wer","who","N","Wer ist das? – Das ist mein Bruder.","Who is that? – That's my brother.","Asks for the SUBJECT (a person). Verb in position 2.","Answer is Nominativ: 'Das ist mein Bruder' (not 'meinen Bruder')."],["A1","1","Thing","was","what","N/A","Was ist das? / Was kaufst du?","What is that? / What are you buying?","Asks for a thing or fact. Nominativ (subject) or Akkusativ (object) depending on role.","Same form for Nom & Akk – only pronouns like wer/wen change."],["A1","1","Place","wo","where (location, no movement)","–","Wo wohnst du? – Ich wohne in Berlin.","Where do you live? – I live in Berlin.","Asks WHERE something/someone IS. Answer uses Dativ prepositions or place names.","Contrast with wohin (movement) – see Week 3."],["A1","1","Origin","woher","where from","–","Woher kommst du? – Ich komme aus Italien.","Where are you from? – I come from Italy.","Asks about origin. Typical answer: aus + Dativ.","woher = wo + her (from where)."],["A1","1","Manner","wie","how","–","Wie heißt du? Wie geht es dir?","What's your name? How are you?","Asks about manner, quality, or (with heißen) name.","'Wie heißt du?' literally 'How are you called?'."],["A1","1","Time","wann","when","–","Wann hast du Geburtstag?","When is your birthday?","Asks for a point in time.","Contrast with wie lange (duration, Week 6) and wie oft (frequency, Week 6)."],["A1","1","Reason","warum","why","–","Warum lernst du Deutsch? – Weil ich in Deutschland arbeiten möchte.","Why are you learning German? – Because I want to work in Germany.","Asks for a reason. Answer usually with weil or denn.","Neutral, most common 'why' word – used at every level."],["A1","2","Quantity","wie viel","how much (uncountable)","–","Wie viel Zeit hast du? Wie viel kostet das?","How much time do you have? How much does that cost?","+ singular noun without article, for uncountable/mass nouns or money.","wie viel Geld, wie viel Zeit, wie viel Uhr (time)."],["A1","2","Quantity","wie viele","how many (countable)","–","Wie viele Geschwister hast du?","How many siblings do you have?","+ plural noun, for countable items.","wie viele Personen, wie viele Bücher."],["A1","2","Age","wie alt","how old","–","Wie alt bist du? – Ich bin 25 Jahre alt.","How old are you? – I'm 25 years old.","Fixed combination with sein.","Never 'Wie viele Jahre hast du?' – that's wrong in German."],["A1","2","Time","wie spät","what time (clock)","–","Wie spät ist es? – Es ist drei Uhr.","What time is it? – It's three o'clock.","Fixed combination, alternative to 'Wie viel Uhr ist es?'.","Wie viel Uhr ist es? = same meaning."],["A1","3","Direction","wohin","where to (movement, destination)","–","Wohin gehst du? – Ich gehe ins Kino.","Where are you going? – I'm going to the cinema.","Asks about DIRECTION/goal. Answer uses Akkusativ prepositions (in die Stadt) or nach/zu + Dativ.","wo (location/Dativ) vs. wohin (direction/Akkusativ) – key A1 contrast."],["A1","3","Selection","welcher / welche / welches","which","N/A/D","Welchen Pullover möchtest du? – Den blauen.","Which sweater would you like? – The blue one.","Asks for a choice from a set; declines like the definite article (der-word).","Full declension table on 'Case Tables'."],["A1","4","Person (obj.)","wen","whom (direct object)","A","Wen siehst du? – Ich sehe meinen Freund.","Who(m) do you see? – I see my friend.","Akkusativ form of wer – asks for the person as direct object.","Test: 'Wen oder was?' → Akkusativ."],["A1","4","Well-being","Wie geht's? / Wie geht es dir/Ihnen?","how are you","D","Wie geht es Ihnen? – Danke, mir geht es gut.","How are you? – Thanks, I'm fine.","Fixed Dativ phrase – dir (informal) / Ihnen (formal).","Dativ (dir/Ihnen) even though it looks like a subject question."],["A2","5","Person (obj.)","wem","whom (indirect object / to whom)","D","Wem gehört das Auto? – Das gehört meinem Vater.","Whose car is that? (lit. To whom belongs) – It's my father's.","Dativ form of wer – asks for the person receiving/benefiting.","Used with Dativ verbs: wem hilfst du? wem gefällt das?"],["A2","5","Reason","weshalb / wieso","why (alternative to warum)","–","Wieso bist du so spät? Weshalb hat er abgesagt?","Why are you so late? Why did he cancel?","Synonyms of warum, slightly more casual (wieso) or written (weshalb). Same word order.","warum = neutral; wieso = colloquial; weshalb = a bit more formal/written."],["A2","5","Duration","wie lange","how long (duration)","–","Wie lange lernst du schon Deutsch? – Seit einem Jahr.","How long have you been learning German? – For a year.","Asks about the LENGTH of an action/state, often answered with seit + Dativ or a duration.","Different from wann (a point in time)."],["A2","5","Frequency","wie oft","how often","–","Wie oft gehst du ins Fitnessstudio? – Zweimal die Woche.","How often do you go to the gym? – Twice a week.","Asks about frequency; answered with immer/oft/manchmal/nie.",""],["A2","5","Indirect (yes/no)","ob","whether / if","–","Ich weiß nicht, ob er kommt.","I don't know whether he's coming.","Introduces an INDIRECT yes/no question (no direct W-word); verb goes to the END.","Not a W-word itself but functions the same way for yes/no questions embedded in a sentence."],["A2","6","Indirect (W-word)","Indirect W-questions","(reported question)","–","Direkt: Wo wohnst du? → Indirekt: Kannst du mir sagen, wo du wohnst?","Direct: Where do you live? → Indirect: Can you tell me where you live?","A direct question (Wo? Was? Wann? …) becomes a Nebensatz: W-word + subject … + verb at the END.","Very common in polite requests: Wissen Sie, wo …? Können Sie mir sagen, wann …?"],["A2","6","Kind/type","was für ein / was für eine","what kind of","N/A/D","Was für ein Auto hast du? – Ein deutsches Auto. Mit was für einem Auto fährst du?","What kind of car do you have? – A German car.","Asks about TYPE or quality, not selection from a known set (unlike welcher). 'für' does NOT trigger Akkusativ here – the case comes from the sentence role.","welcher = 'which one (of these)'; was für ein = 'what kind/sort'."],["A2","6","Purpose","wozu","what for / to what end","–","Wozu brauchst du das Geld? – Um eine Reise zu machen.","What do you need the money for? – To take a trip.","Asks about the PURPOSE of an action (= für welchen Zweck). Answer often with um…zu or dafür.","More specific than warum (reason vs. purpose)."],["A2","7","Possession","wessen","whose","G","Wessen Auto ist das? – Das ist das Auto meines Bruders.","Whose car is that? – That's my brother's car.","Genitiv form of wer – asks about possession. Followed directly by a noun, no article.","Formal/written; in speech 'Wem gehört das?' is much more common."],["A2","7","Manner","wieso vs. warum vs. weshalb (nuance)","why (register)","–","(Casual) Wieso denn das? / (Formal) Weshalb haben Sie sich beworben?","Why on earth? / Why did you apply?","All three ask for a reason; warum is neutral and safe in all situations; wieso feels casual/direct; weshalb feels more formal/written.","Use warum by default if unsure."],["B1","8","wo-compound","woran","on/of what (thinking, working)","–","Woran denkst du? – Ich denke an meinen Urlaub.","What are you thinking about? – I'm thinking about my holiday.","Formed as wo(r) + an. Used for THINGS (not people) after verbs with 'an': denken an, arbeiten an.","For people use preposition + wen/wem: An wen denkst du?"],["B1","8","wo-compound","worauf","for/on what (waiting, looking forward)","–","Worauf wartest du? – Ich warte auf den Bus.","What are you waiting for? – I'm waiting for the bus.","Formed as wo(r) + auf. Used with warten auf, sich freuen auf, achten auf.",""],["B1","8","wo-compound","worüber","about what","–","Worüber sprecht ihr? – Über das Wetter.","What are you talking about? – About the weather.","Formed as wo(r) + über. Used with sprechen über, sich freuen über, sich ärgern über.",""],["B1","8","wo-compound","wovon","of/about/from what","–","Wovon träumst du? – Von einem eigenen Haus.","What do you dream of? – Of my own house.","Formed as wo + von. Used with träumen von, erzählen von, abhängen von.",""],["B1","8","wo-compound","womit","with what","–","Womit beschäftigst du dich gerade?","What are you working on / dealing with right now?","Formed as wo + mit. Used with arbeiten mit, sich beschäftigen mit.",""],["B1","8","wo-compound","wofür","for what / what … for","–","Wofür interessierst du dich?","What are you interested in?","Formed as wo + für. Used with sich interessieren für, sich entscheiden für.",""],["B1","8","wo-compound","wogegen","against what","–","Wogegen protestieren die Leute?","What are the people protesting against?","Formed as wo + gegen. Used with protestieren gegen, sein gegen.",""],["B1","8","wo-compound","woraus","out of / from what","–","Woraus besteht dieses Material?","What is this material made of?","Formed as wo + aus. Used with bestehen aus, folgen aus.",""],["B1","8","wo-compound","worin","in what","–","Worin unterscheiden sich die beiden Modelle?","In what way do the two models differ?","Formed as wo(r) + in. Used with bestehen in, sich unterscheiden in.",""],["B1","8","wo-compound rule","wo(r)- + preposition","(formation rule)","–","Sache: Worauf wartest du? / Person: Auf wen wartest du?","What are you waiting for? / Who are you waiting for?","For THINGS/IDEAS: wo- + preposition (wo- + r- before a vowel: worauf, woran). For PEOPLE: preposition + wen/wem/wessen.","Mixing these up is a very common learner mistake."],["B1","9","Manner/extent","inwiefern / inwieweit","to what extent / in what way","–","Inwiefern hat sich die Situation verändert?","In what way / to what extent has the situation changed?","Formal, more precise than 'wie' – asks HOW MUCH or in what respect something is true.","Typical of formal writing, discussions, essays – B1/B2 register."],["B1","9","Rhetorical","Rhetorical W-questions","(no real answer expected)","–","Wer soll das bezahlen? (= niemand kann das bezahlen)","Who's supposed to pay for that? (implying: nobody can)","W-question used to make a point rather than get information; common in spoken argument.","Tone/context signals it's rhetorical, not a real request for information."],["B1","9","Combined","Combining question words","(layered questions)","–","Weißt du, wer das gesagt hat und warum?","Do you know who said that and why?","Two question elements can combine in one sentence when reporting or asking complex things.","Each embedded question still sends its verb to the end."],["B1","10","Selection (case)","welcher – full declension","which (all cases)","NADG","Mit welchem Zug fährst du? Wegen welches Problems rufst du an?","Which train are you taking? Because of which problem are you calling?","Declines exactly like the definite article in all 4 cases: welcher/welche/welches/welche (N), welchen/welche/welches/welche (A), welchem/welcher/welchem/welchen (D), welches/welcher/welches/welcher (G).","Genitiv use is rare/formal – mostly heard with welche in Nom/Akk/Dat."],["B1","10","Quantity + case","wie viel / wie viele + case","how much/many (declined context)","NADG","Mit wie vielen Leuten hast du gesprochen?","How many people did you speak with?","The noun after wie viel(e) takes whatever case the sentence requires (not always Nominativ).","'wie viele' stays the same; only the following noun/article changes case."],["B2","19","Formal indirect","Indirect questions in formal writing","(reported/embedded question, formal register)","–","Es stellt sich die Frage, inwiefern die Maßnahme wirksam ist.","The question arises as to what extent the measure is effective.","In reports, emails and Konjunktiv I contexts, indirect W-questions are common: Es stellt sich die Frage, wie/ob/warum…","Typical opener in essays/reports: 'Es stellt sich die Frage, ob/wie/warum …'."],["B2","19","Nominalized","W-word → noun (indirect question as topic)","(turning a question into a discussion topic)","–","Die Frage, ob sich die Investition lohnt, bleibt offen.","The question of whether the investment is worthwhile remains open.","'die Frage, ob/wie/warum…' turns an indirect question into a noun phrase, common in Nominalstil.","Pairs with B2 Nominalstil topic (Grammar Master, Week 18)."],["B2","20","Discourse marker","na, wer weiß? / wer weiß, ob…","who knows (uncertainty)","–","Wer weiß, ob das stimmt.","Who knows if that's true.","Idiomatic use of wer in fixed expressions of doubt/uncertainty.","Colloquial register – contrast with the formal 'inwiefern' style above."],["B2","20","Emphatic","Was denn? / Wie bitte? / Wieso denn das?","(surprised/emphatic reactions)","–","Wie bitte? Das hast du wirklich gesagt? Was denn los?","Excuse me? You really said that? What's going on?","Modal particle 'denn' added to a W-question signals surprise, curiosity, or mild challenge in speech.","Combine with the Modal Particles topic (Grammar Master, Week 24)."],["B2","21","Two-part contrast","warum vs. wieso vs. weshalb vs. wozu vs. inwiefern","(full 'why/what for' register map)","–","Warum bist du gegangen? / Wozu brauchst du das? / Inwiefern betrifft dich das?","Why did you leave? / What do you need that for? / In what way does that affect you?","warum = neutral default; wieso = casual/direct; weshalb = formal/written; wozu = purpose ('what for'); inwiefern = extent/aspect (formal, analytical).","Use this row as a quick reference when choosing the right 'why'-word for the register."],["B2","21","Formal correlative","Vorfeld W-question + Nachfeld clause","(W-word fronting a longer clause)","–","Wie erklären Sie sich, dass die Zahlen trotz der Krise gestiegen sind?","How do you explain that the figures rose despite the crisis?","In formal/spoken B2 German, a W-question can front a topic before a longer relative or subordinate explanation follows.","Ties to B2 Word Order topic (Grammar Master, Week 27: Vorfeld/Mittelfeld/Nachfeld)."],["B2","22","Job interview use","Typical interview W-questions (interviewer & candidate)","(applied register)","–","Wie gehen Sie mit Kritik um? Inwiefern passt die Stelle zu Ihren Zielen?","How do you deal with criticism? To what extent does the role fit your goals?","W-questions dominate interviews on both sides: Warum bewerben Sie sich? Wo sehen Sie sich in 5 Jahren? Welche Fragen haben Sie an uns?","See the 'Job & HR' sheet for full interview Q&A by level."]]},"Case Tables":{"h":[],"r":[["1. THE FOUR CASES AT A GLANCE"],["Case","Question","Function","Typical triggers","Example","Level"],["Nominativ","Wer? Was?","Subject; noun after sein / werden / bleiben","Every subject","Der Mann ist Lehrer.","A1"],["Akkusativ","Wen? Was?  Wohin?","Direct object; direction; definite time","most verbs; für, durch, gegen, ohne, um; two-way prepositions with movement","Ich sehe den Mann.","A1"],["Dativ","Wem?  Wo?","Indirect object; location","helfen, gefallen, geben (person); aus, bei, mit, nach, seit, von, zu; two-way prepositions with location","Ich helfe dem Mann.","A1–A2"],["Genitiv","Wessen?","Possession / relationship; formal prepositions","wegen, trotz, während, (an)statt, aufgrund…; a few formal verbs","Das Auto des Mannes ist neu.","B1"],["Tip: colour-code in your notes – Nominativ blue, Akkusativ red, Dativ green, Genitiv gold."],["2. DEFINITE ARTICLE (der / die / das)"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","den (+n on noun)"],["Genitiv","des (+ -(e)s on noun)","der","des (+ -(e)s on noun)","der"],["Only the masculine changes in the Akkusativ (der → den). Dativ plural nouns add -n (den Kindern). Genitiv m/n nouns add -s/-es (des Mannes)."],["3. INDEFINITE ARTICLE & kein- / possessives (ein-words)"],["Case","Masculine","Feminine","Neuter","Plural (kein-/mein-)"],["Nominativ","ein / kein / mein","eine / keine / meine","ein / kein / mein","keine / meine"],["Akkusativ","einen / keinen / meinen","eine / keine / meine","ein / kein / mein","keine / meine"],["Dativ","einem / keinem / meinem","einer / keiner / meiner","einem / keinem / meinem","keinen / meinen (+n)"],["Genitiv","eines / keines / meines","einer / keiner / meiner","eines / keines / meines","keiner / meiner"],["ein has NO plural. Possessives: mein, dein, sein, ihr, unser, euer (eure), ihr, Ihr – all decline like kein."],["4. dieser-words (dieser, jeder, welcher, solcher, mancher; alle)"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","dieser","diese","dieses","diese"],["Akkusativ","diesen","diese","dieses","diese"],["Dativ","diesem","dieser","diesem","diesen"],["Genitiv","dieses","dieser","dieses","dieser"],["5. PERSONAL PRONOUNS"],["Person","Nominativ","Akkusativ","Dativ","Genitiv (rare)","Possessive article"],["ich","ich","mich","mir","meiner","mein-"],["du","du","dich","dir","deiner","dein-"],["er","er","ihn","ihm","seiner","sein-"],["sie (she)","sie","sie","ihr","ihrer","ihr-"],["es","es","es","ihm","seiner","sein-"],["wir","wir","uns","uns","unser","unser-"],["ihr","ihr","euch","euch","euer","euer-"],["sie (they)","sie","sie","ihnen","ihrer","ihr-"],["Sie (formal)","Sie","Sie","Ihnen","Ihrer","Ihr-"],["Word order with two pronouns: Akkusativ before Dativ (Ich gebe es ihm). Noun objects: Dativ before Akkusativ (Ich gebe dem Kind den Ball)."],["6. REFLEXIVE PRONOUNS"],["Person","Akkusativ","Dativ"],["ich","mich","mir"],["du","dich","dir"],["er / sie / es","sich","sich"],["wir","uns","uns"],["ihr","euch","euch"],["sie / Sie","sich","sich"],["Dativ reflexive if another Akkusativ object is present: Ich wasche mich (Akk). / Ich wasche mir die Hände (Dat)."],["7. QUESTION WORDS (wer / was)"],["Case","Person","Thing","With preposition"],["Nominativ","wer?","was?","–"],["Akkusativ","wen?","was?","Für wen? / Wofür?"],["Dativ","wem?","–","Mit wem? / Womit?"],["Genitiv","wessen?","wessen?","–"],["Prepositions with people: preposition + wen/wem. With things: wo(r) + preposition (worauf, woran, womit)."],["8. RELATIVE PRONOUNS (B1)"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","denen"],["Genitiv","dessen","deren","dessen","deren"],["Gender/number from the noun the clause refers to; CASE from the pronoun's role inside the relative clause. Verb at the end, commas on both sides."],["9a. ADJECTIVE ENDINGS – after the definite article (der-words)"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","-e  der große Hund","-e  die kleine Katze","-e  das neue Auto","-en  die alten Häuser"],["Akkusativ","-en  den großen Hund","-e  die kleine Katze","-e  das neue Auto","-en  die alten Häuser"],["Dativ","-en  dem großen Hund","-en  der kleinen Katze","-en  dem neuen Auto","-en  den alten Häusern"],["Genitiv","-en  des großen Hundes","-en  der kleinen Katze","-en  des neuen Autos","-en  der alten Häuser"],["9b. ADJECTIVE ENDINGS – after ein-words (ein, kein, mein…)"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","-er  ein großer Hund","-e  eine kleine Katze","-es  ein neues Auto","-en  keine alten Häuser"],["Akkusativ","-en  einen großen Hund","-e  eine kleine Katze","-es  ein neues Auto","-en  keine alten Häuser"],["Dativ","-en  einem großen Hund","-en  einer kleinen Katze","-en  einem neuen Auto","-en  keinen alten Häusern"],["Genitiv","-en  eines großen Hundes","-en  einer kleinen Katze","-en  eines neuen Autos","-en  keiner alten Häuser"],["9c. ADJECTIVE ENDINGS – without article"],["Case","Masculine","Feminine","Neuter","Plural"],["Nominativ","-er  frischer Kaffee","-e  kalte Milch","-es  frisches Brot","-e  gute Freunde"],["Akkusativ","-en  frischen Kaffee","-e  kalte Milch","-es  frisches Brot","-e  gute Freunde"],["Dativ","-em  frischem Kaffee","-er  kalter Milch","-em  frischem Brot","-en  guten Freunden"],["Genitiv","-en  frischen Kaffees","-er  kalter Milch","-en  frischen Brotes","-er  guter Freunde"],["Memory trick: when the article shows the case, the adjective takes -e / -en; when the article is missing or has no ending, the adjective carries the case (like der/die/das)."],["10. n-DEKLINATION (masculine weak nouns)"],["Case","der Junge","der Kunde","der Student","der Name (special)","der Herr (special)"],["Nominativ","der Junge","der Kunde","der Student","der Name","der Herr"],["Akkusativ","den Jungen","den Kunden","den Studenten","den Namen","den Herrn"],["Dativ","dem Jungen","dem Kunden","dem Studenten","dem Namen","dem Herrn"],["Genitiv","des Jungen","des Kunden","des Studenten","des Namens","des Herrn"],["Also: Kollege, Nachbar, Mensch, Polizist, Praktikant, Junge, Löwe, Bär, Affe. Only masculine; -(e)n in every case except Nominativ singular."],["11. CASE CHEAT-SHEET"],["Rule","Detail"],["Nominativ → Akkusativ","Only masculine changes: der → den, ein → einen, kein → keinen, mein → meinen."],["Dativ","dem / der / dem / den(+n). Add -n to plural nouns."],["Genitiv","des / der / des / der. Add -(e)s to masculine & neuter nouns."],["Two-way prepositions","Wo? (location) → Dativ. Wohin? (movement) → Akkusativ."],["Verb + case","Most verbs: Akk. Dativ only: helfen, danken, gefallen, gehören, schmecken, passen, gratulieren, antworten…"],["Passive","Active Akk object → passive Nom subject. Dativ stays Dativ."]]},"Grammar Master":{"h":["Status","Level","Week","Topic","Item","Rule / how it works","Example (DE)","Meaning (EN)","Nominativ","Akkusativ","Dativ","Genitiv","Tip / watch out"],"r":[["","A1","1","Alphabet & spelling","German alphabet","26 letters + ä, ö, ü, ß. Every letter has a NAME; spelling names/words is asked constantly. Details on sheet 'Alphabet & Sounds'.","Wie schreibt man das? – M-Ü-L-L-E-R.","How do you spell that? – M-U-umlaut-L-L-E-R.","","","","","Learn the letter NAMES (not sounds) for spelling. y = 'Ypsilon'."],["","A1","1","Personal pronouns","ich, du, er, sie, es, wir, ihr, sie, Sie","Nominative pronouns replace the SUBJECT. du = informal singular (friends, family, children); ihr = informal plural; Sie = formal singular AND plural (always capital S); sie (small s) = she OR they.","Ich bin Tom. Du bist Anna. Sie sind Herr Bauer.","I am Tom. You are Anna. You (formal) are Mr Bauer.","✔","","","","sie (she) / sie (they) / Sie (formal you): only the verb form and capital letter tell them apart."],["","A1","1","du vs. Sie","Informal vs. formal address","Use Sie with strangers, officials, customers, older people, in professional settings. Use du with friends, family, children, peers. Sie always takes the 3rd-person-plural verb form.","Wie heißt du? / Wie heißen Sie?","What's your name? (informal / formal)","✔","","","","When unsure, use Sie until the other person offers 'du' (Wir können uns duzen)."],["","A1","1","sein (to be)","Present tense","ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. The noun after 'sein' is ALSO Nominative (no Akkusativ after sein, werden, bleiben).","Das ist ein Hund. Wir sind Studenten.","That is a dog. We are students.","✔","","","","'Das ist der Mann' – NOT 'den Mann'."],["","A1","1","Question words","wer, was, wo, woher, wohin, wie, wann, warum, wie viel","W-word in position 1, conjugated verb in position 2. wer/was ask for the subject (Nominativ).","Woher kommst du? – Ich komme aus Spanien.","Where do you come from? – I come from Spain.","✔","","","","'Wie heißt du?' literally means 'How are you called?'"],["","A1","1","Word order","Verb in position 2","In a statement the conjugated verb is always the 2nd element. Position 1 can be the subject, a time, a place… then the subject follows the verb (inversion).","Ich lerne heute Deutsch. / Heute lerne ich Deutsch.","I learn German today.","✔","","","","Count ELEMENTS, not words: 'Am Montag' is one element."],["","A1","1","Verbs – present","Regular verbs","Stem + -e, -st, -t, -en, -t, -en. wohnen: ich wohne, du wohnst, er wohnt, wir wohnen, ihr wohnt, sie wohnen. Stems ending in -t/-d/-tm/-chn/-fn add an -e-: du arbeitest, er arbeitet. Stems in -s/-ß/-x/-z: du heißt.","Ich wohne in Berlin. Du arbeitest viel.","I live in Berlin. You work a lot.","✔","","","","Infinitive = stem + -en (wohn-en). wir/sie/Sie always = infinitive."],["","A1","1","haben (to have)","Present tense","ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben. The thing you have is a direct object (Akkusativ).","Ich habe zwei Geschwister. Sie hat einen Hund.","I have two siblings. She has a dog.","","✔","","","Age: 'Ich bin 20 Jahre alt' – NOT 'Ich habe 20 Jahre'."],["","A1","1","Nouns","Gender & articles (der/die/das)","Every noun has a gender: der (masculine), die (feminine), das (neuter); plural = die. ALL nouns are capitalised. Learn the article with each noun.","der Mann, die Frau, das Kind, die Kinder","the man, the woman, the child, the children","✔","","","","Write nouns in three colours (blue der / red die / green das)."],["","A1","1","Nouns","Plural formation","5 main types: -e (Tag→Tage; ± umlaut Stuhl→Stühle), -er (± umlaut Kind→Kinder, Haus→Häuser), -(e)n (Frau→Frauen), -s (Auto→Autos), no ending (Lehrer→Lehrer, Vater→Väter).","ein Tisch – zwei Tische; ein Buch – zwei Bücher","one table – two tables; one book – two books","✔","","","","Most feminine nouns take -(e)n; nouns in -er/-el/-en usually stay unchanged; loanwords often -s."],["","A1","1","Articles","Indefinite article ein/eine","ein (masculine & neuter), eine (feminine). There is NO plural of ein.","Das ist ein Tisch, eine Lampe und ein Buch. Das sind Bücher.","That is a table, a lamp and a book. Those are books.","✔","","","","Plural without article: 'Ich habe Bücher.'"],["","A1","1","Questions","Yes/No question","Conjugated verb in position 1; answer with ja/nein.","Bist du müde? – Ja, ich bin müde.","Are you tired? – Yes, I'm tired.","✔","","","",""],["","A1","1","Answers","ja / nein / doch","'Doch' = yes, in answer to a NEGATIVE question or statement.","Hast du keinen Hunger? – Doch, ich habe Hunger.","Aren't you hungry? – Yes, I am.","","","","","Ja to a negative question is a very common mistake."],["","A1","1","Numbers","Numbers 0–100","Units come BEFORE tens and are joined with 'und': 21 = einundzwanzig. See 'A1 Basics'.","Ich bin fünfundzwanzig Jahre alt.","I am 25 years old.","","","","","eins → ein before a noun: ein Euro, aber: es ist eins."],["","A1","1","Accusative","Akkusativ – direct object","The direct object (Wen? Was?) is in Akkusativ. ONLY the masculine changes: der→den, ein→einen, kein→keinen. die/das/die and eine/ein stay the same.","Ich kaufe den Apfel, die Banane und das Brot. / Ich kaufe einen Apfel.","I'm buying the apple, the banana and the bread.","","✔","","","Test: ask 'Wen oder was kaufe ich?' → den Apfel."],["","A1","1","Accusative","Verbs that usually take Akkusativ","haben, kaufen, essen, trinken, brauchen, suchen, sehen, lesen, machen, mögen, lieben, besuchen, nehmen, finden","Ich trinke einen Kaffee und esse ein Brötchen.","I drink a coffee and eat a roll.","","✔","","","Sheet 'Verbs & Cases' has fuller lists."],["","A1","1","Negation","kein vs. nicht","kein negates nouns with ein-/no article (kein declines like ein). nicht negates verbs, adjectives, adverbs and nouns with definite article/possessive.","Ich habe keinen Bruder. / Ich komme nicht aus Polen. / Das ist nicht mein Auto.","I have no brother. / I don't come from Poland. / That isn't my car.","✔","✔","","","Rule of thumb: ein-/no article → kein; everything else → nicht."],["","A1","1","Verbs","Stem-changing verbs","Only du and er/sie/es change: e→i (sprechen, geben, nehmen, essen, helfen), e→ie (lesen, sehen), a→ä (fahren, schlafen, laufen, tragen).","Er isst einen Apfel und liest ein Buch. Du fährst nach Berlin.","He eats an apple and reads a book. You drive to Berlin.","","","","","Learn them as 'du/er-forms': du sprichst/er spricht, du liest/er liest, du fährst/er fährt."],["","A1","1","Modal verbs","können (can, be able to)","ich kann, du kannst, er kann, wir können, ihr könnt, sie können. Conjugated modal in position 2, infinitive at the END. ich/er forms have NO ending.","Ich kann gut schwimmen.","I can swim well.","","","","","No 'zu' with modal verbs."],["","A1","1","Modal verbs","müssen (must, have to)","ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen.","Ich muss heute arbeiten.","I have to work today.","","","","","'nicht müssen' = don't have to (not 'must not'). 'Must not' = nicht dürfen."],["","A1","1","Modal verbs","wollen (want to)","ich will, du willst, er will, wir wollen, ihr wollt, sie wollen. Stronger than möchten.","Wir wollen ins Kino gehen.","We want to go to the cinema.","","","","",""],["","A1","1","Modal verbs","möchten (would like to)","ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, sie möchten. Polite form; used as a modal or with a noun.","Ich möchte einen Kaffee. / Ich möchte tanzen.","I'd like a coffee. / I'd like to dance.","","✔","","","Politer than 'ich will'."],["","A1","1","Modal verbs","dürfen (may, be allowed to)","ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. Permission. 'nicht dürfen' = prohibition.","Hier darf man nicht rauchen.","You may not smoke here.","","","","",""],["","A1","1","Modal verbs","sollen (should, be supposed to)","ich soll, du sollst, er soll, wir sollen, ihr sollt, sie sollen. Obligation from someone else / advice.","Du sollst mehr Wasser trinken.","You should drink more water.","","","","",""],["","A1","1","Sentence structure","Satzklammer (sentence bracket)","Two-part verbs frame the sentence: modal (pos. 2) … infinitive (end); separable verb (pos. 2) … prefix (end); later haben/sein (pos. 2) … Partizip II (end).","Ich möchte morgen mit dir ins Kino gehen.","I'd like to go to the cinema with you tomorrow.","","","","","Everything else goes in the middle."],["","A1","1","Preferences","gern / lieber / am liebsten","gern = like doing; lieber = prefer; am liebsten = like most. Used with a verb, not with mögen.","Ich spiele gern Tennis, lieber Fußball und am liebsten schwimme ich.","I like playing tennis, prefer football and like swimming most.","","","","","'Ich mag gern Tee' is wrong – say 'Ich trinke gern Tee' or 'Ich mag Tee'."],["","A1","1","Negation","Position of nicht","nicht at the END for the whole sentence; BEFORE the part being negated (adjective, adverb, prepositional phrase); BEFORE the second verb part in a Satzklammer.","Ich arbeite nicht. / Das ist nicht gut. / Ich fahre nicht nach Berlin. / Ich kann nicht kommen.","I don't work. / That isn't good. / I'm not going to Berlin. / I can't come.","","","","",""],["","A1","2","Separable verbs","Trennbare Verben","Prefix (an, auf, aus, ein, fern, mit, vor, zu, zurück, ab, weg, um…) separates and goes to the END in main clauses. With modal verbs: infinitive stays together.","Ich stehe um 7 Uhr auf. / Ich muss früh aufstehen.","I get up at 7. / I have to get up early.","","✔","","","The prefix is stressed: AUFstehen."],["","A1","2","Time","Telling the time","Formal (24 h): 14:30 = vierzehn Uhr dreißig. Informal (12 h): halb drei (=2:30), Viertel nach/vor, zehn nach/vor. 'halb drei' = half TO three.","Es ist Viertel vor acht. Der Zug fährt um 14:30 Uhr.","It's a quarter to eight. The train leaves at 2:30 pm.","","","","","See 'A1 Basics' for the full table."],["","A1","2","Prepositions of time","am / um / im / von…bis","am + day/date/part of day (am Montag, am Morgen); um + clock time (um 8 Uhr); im + month/season (im Mai, im Winter); von…bis; aber: in der Nacht, am Wochenende.","Am Montag um 8 Uhr habe ich Deutsch. Im Juli fahre ich weg.","On Monday at 8 I have German. In July I go away.","","","✔","","am = an dem, im = in dem (Dativ contractions)."],["","A1","2","Adverbs","Frequency adverbs","immer (always), oft (often), manchmal (sometimes), selten (rarely), nie (never). Usually after the verb; can start the sentence for emphasis.","Ich gehe oft ins Kino. Manchmal koche ich.","I often go to the cinema. Sometimes I cook.","","","","",""],["","A1","2","Imperative","Imperativ (du / ihr / Sie)","du: stem (Komm!), ihr: -t (Kommt!), Sie: infinitive + Sie (Kommen Sie!). e→i(e) verbs keep the change (Lies! Nimm!), a→ä verbs lose the umlaut (Fahr!). sein: Sei! Seid! Seien Sie! Separable: Steh auf!","Komm bitte um acht! Nehmen Sie Platz!","Please come at eight! Have a seat!","","","","","Add 'bitte' to soften."],["","A1","2","Possessives","mein, dein, sein, ihr, unser, euer, ihr, Ihr","Possessive articles decline like ein/kein: Nom m/n: mein; f: meine; pl: meine. Akk masculine: meinen. euer → eure (drops -e-). sein = his/its; ihr = her/their; Ihr = your (formal).","Das ist meine Schwester. Ich besuche meinen Bruder.","That is my sister. I'm visiting my brother.","✔","✔","","","Ending depends on the NOUN you're possessing, not the owner."],["","A1","2","Pronouns","Personal pronouns – Akkusativ","mich, dich, ihn, sie, es, uns, euch, sie, Sie. Replace direct objects.","Ich sehe ihn. Er liebt dich.","I see him. He loves you.","","✔","","","Full table on 'Case Tables'."],["","A1","2","Expressions","es gibt + Akkusativ","'es gibt' = there is/are; ALWAYS singular 'gibt'; the thing is in Akkusativ.","In der Stadt gibt es einen Bahnhof und viele Restaurants.","In the city there is a station and many restaurants.","","✔","","","Never 'es geben'."],["","A1","2","Dative prepositions","aus, bei, mit, nach, seit, von, zu","ALWAYS + Dativ. Dativ articles: dem (m/n), der (f), den + noun-n (pl). Mnemonic: 'aus, bei, mit, nach, seit, von, zu'.","Ich fahre mit dem Bus zur Arbeit. Er wohnt bei seinen Eltern.","I go to work by bus. He lives with his parents.","","","✔","","Full list with examples on 'Prepositions'."],["","A1","2","Contractions","zum, zur, beim, vom, im, am, ins","zu+dem=zum, zu+der=zur, bei+dem=beim, von+dem=vom, in+dem=im, an+dem=am, in+das=ins, an+das=ans, auf+das=aufs.","Ich gehe zum Arzt und dann zur Bank.","I go to the doctor and then to the bank.","","","✔","","Use contractions in speech; write out only for emphasis."],["","A1","2","Accusative prepositions","durch, für, gegen, ohne, um","ALWAYS + Akkusativ. Mnemonic: 'durch, für, gegen, ohne, um' (+ bis, entlang).","Das Geschenk ist für dich. Wir gehen durch den Park.","The gift is for you. We walk through the park.","","✔","","",""],["","A1","2","Questions","Wo? – Wohin? – Woher?","Wo = location (Dativ with in/an/auf); Wohin = direction (nach/zu/in + Akk); Woher = origin (aus/von + Dativ).","Wo bist du? – Im Park. / Wohin gehst du? – In den Park. / Woher kommst du? – Aus Rom.","Where are you? – In the park. / Where are you going? – To the park.","","✔","✔","","Full rule in Week 4 (Wechselpräpositionen)."],["","A1","2","Directions","Giving directions","Imperative Sie: Gehen Sie geradeaus / links / rechts. Use: an der Ampel, an der Kreuzung, über die Brücke, bis zur Kirche.","Gehen Sie geradeaus und dann links. Die Bank ist neben dem Bahnhof.","Go straight and then left. The bank is next to the station.","","✔","✔","",""],["","A1","2","Adjectives","Predicate adjectives","After sein/werden/bleiben the adjective has NO ending.","Die Jacke ist teuer. Das Wetter bleibt schön.","The jacket is expensive. The weather stays nice.","✔","","","","Endings only appear BEFORE a noun (Week 6)."],["","A1","2","Demonstratives","dieser, diese, dieses","Declines like the definite article: Nom dieser/diese/dieses/diese; Akk diesen/diese/dieses/diese.","Diesen Pullover finde ich schön. Dieses Buch ist neu.","I find this sweater nice. This book is new.","✔","✔","","",""],["","A1","2","Dative (fixed phrases)","mir / dir / Ihnen in set phrases","Learn as chunks: Wie geht's dir/Ihnen? – Mir geht's gut. Das gefällt mir. Das schmeckt mir. Es tut mir leid. Mir ist kalt/warm/schlecht.","Wie geht es Ihnen? – Danke, mir geht es gut.","How are you? – Thanks, I'm fine.","","","✔","","Full Dativ system in Week 4."],["","A1","2","Prices","kosten / wie viel","Was kostet …? Wie viel kostet …? Wie viele + countable plural. Prices: 4,50 € = vier Euro fünfzig.","Was kostet die Jacke? – Sie kostet 49 Euro.","How much is the jacket? – It costs 49 euros.","","✔","","","kosten takes Akkusativ (Das kostet mich 50 Euro)."],["","A2","3","Perfekt","Formation (haben + Partizip II)","Conjugated haben (pos. 2) + Partizip II (end). Used for spoken past. Most verbs use haben, incl. all transitive & reflexive verbs.","Gestern habe ich einen Film gesehen.","Yesterday I watched a film.","","✔","","","Satzklammer: habe … gesehen."],["","A2","3","Perfekt","Partizip II – regular","ge- + stem + -t: machen → gemacht; lernen → gelernt; stems in -t/-d/-n: ge- + stem + -et: arbeiten → gearbeitet; regnen → geregnet.","Ich habe Deutsch gelernt.","I learned German.","","","","",""],["","A2","3","Perfekt","Partizip II – irregular","ge- + (changed) stem + -en: sehen → gesehen, schreiben → geschrieben, trinken → getrunken, essen → gegessen. Mixed verbs: bringen → gebracht, denken → gedacht, kennen → gekannt.","Wir haben Pizza gegessen und Wein getrunken.","We ate pizza and drank wine.","","","","","Learn with the list on 'Irregular Verbs'."],["","A2","3","Perfekt","Partizip II – no ge-","No ge- for: verbs in -ieren (studieren → studiert); inseparable prefixes be-, emp-, ent-, er-, ge-, miss-, ver-, zer- (besuchen → besucht, verstehen → verstanden).","Ich habe Medizin studiert. Sie hat mich besucht.","I studied medicine. She visited me.","","✔","","",""],["","A2","3","Perfekt","Partizip II – separable verbs","ge- goes BETWEEN prefix and stem: einkaufen → eingekauft, aufstehen → aufgestanden, anrufen → angerufen.","Ich habe gestern Brot eingekauft.","I bought bread yesterday.","","✔","","",""],["","A2","3","Word order","TeKaMoLo","Middle field order: Temporal – Kausal – Modal – Lokal. Time first, then reason, manner, place.","Ich fahre morgen (Te) mit dem Zug (Mo) nach Berlin (Lo).","I'm taking the train to Berlin tomorrow.","","","","","Time & place vs. manner is the most important pair."],["","A2","3","Usage","Perfekt vs. Präteritum (speech)","In spoken German use Perfekt for most verbs. Exceptions: sein, haben & modal verbs are usually in Präteritum even in speech.","Ich war gestern im Kino. Ich habe einen Film gesehen.","I was at the cinema yesterday. I watched a film.","","","","",""],["","A2","3","Perfekt","Perfekt with sein","Use sein for (1) movement from A to B: gehen, kommen, fahren, fliegen, laufen, reisen; (2) change of state: aufstehen, einschlafen, aufwachen, werden, sterben, wachsen; (3) sein, bleiben, passieren, geschehen, gelingen.","Ich bin nach Berlin gefahren. Wir sind lange geblieben.","I drove to Berlin. We stayed for a long time.","","","","","Transitive 'fahren' uses haben: Ich habe das Auto gefahren."],["","A2","3","Präteritum","sein, haben & modals","sein: war, warst, war, waren, wart, waren. haben: hatte… Modals: konnte, musste, wollte, sollte, durfte, mochte. 1st & 3rd person singular identical.","Ich war krank. Er konnte nicht kommen.","I was sick. He couldn't come.","","","","","Modal Präteritum has NO umlaut (konnte, not könnte)."],["","A2","3","Time expressions","vor / seit / in + Dativ","vor + Dat = ago (vor zwei Tagen); seit + Dat = since/for (ongoing, use Präsens!); in + Dat = in (future); ab + Dat = from.","Vor einer Woche war ich in Wien. Ich lerne seit einem Jahr Deutsch.","A week ago I was in Vienna. I've been learning German for a year.","","","✔","","'Ich habe seit einem Jahr gelernt' is wrong."],["","A2","3","Time expressions","Time in Akkusativ","Definite time expressions without preposition use Akkusativ: jeden Tag, letzte Woche, nächsten Montag, letzten Sommer.","Nächsten Sommer fahre ich nach Italien.","Next summer I'm going to Italy.","","✔","","",""],["","A2","4","Dative","Articles & noun endings","Dativ: dem (m/n), der (f), den (pl) + n on plural noun; einem/einer/einem; keinem/keiner/keinem/keinen; meinem/meiner/meinem/meinen. Question: Wem?","Ich helfe dem Mann, der Frau und den Kindern.","I help the man, the woman and the children.","","","✔","","Plural noun gets -n: den Kindern (except nouns already ending in -n/-s)."],["","A2","4","Dative","Personal pronouns","mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen.","Ich gebe ihr das Buch. Das gefällt mir.","I give her the book. I like that.","","","✔","",""],["","A2","4","Dative","Verbs with Dativ only","helfen, danken, gefallen, gehören, schmecken, passen, gratulieren, antworten, folgen, fehlen, glauben, zuhören, zustimmen, weh tun.","Das Auto gehört meinem Vater. Die Suppe schmeckt mir.","The car belongs to my father. I like the soup.","","","✔","","The 'liked' thing is the SUBJECT: Das Kleid (Nom) gefällt mir (Dat)."],["","A2","4","Dative + Accusative","Verbs with Dativ + Akkusativ","geben, schenken, schicken, zeigen, erklären, bringen, empfehlen, leihen, erzählen, sagen, schreiben, verkaufen, anbieten. Dativ = person, Akkusativ = thing.","Ich schenke meiner Mutter einen Blumenstrauß.","I give my mother a bouquet.","","✔","✔","",""],["","A2","4","Word order","Dat vs. Akk order","Two nouns: Dativ before Akkusativ. Pronoun before noun. Two pronouns: Akkusativ before Dativ.","Ich gebe dem Kind den Ball. / Ich gebe ihm den Ball. / Ich gebe ihn dem Kind. / Ich gebe ihn ihm.","I give the child the ball.","","✔","✔","",""],["","A2","4","Prepositions","Dativ prepositions extended","aus, außer, bei, gegenüber, mit, nach, seit, von, zu (+ ab, entgegen). gegenüber follows pronouns (mir gegenüber).","Außer meinem Bruder sind alle da. Die Post ist gegenüber dem Bahnhof.","Except for my brother everyone is here. The post office is opposite the station.","","","✔","",""],["","A2","4","Two-way prepositions","Wechselpräpositionen","an, auf, hinter, in, neben, über, unter, vor, zwischen. Wo? (location, no movement) → DATIV. Wohin? (movement to a new place) → AKKUSATIV.","Das Buch liegt auf dem Tisch. / Ich lege das Buch auf den Tisch.","The book lies on the table. / I put the book on the table.","","✔","✔","","Ask 'Wo?' or 'Wohin?' – that decides the case."],["","A2","4","Position verbs","stehen/stellen, liegen/legen, sitzen/setzen, hängen","Action (weak verbs: stellen, legen, setzen, hängen) + Akk. State (strong: stehen, liegen, sitzen, hing) + Dat.","Ich stelle die Flasche auf den Tisch. Die Flasche steht auf dem Tisch.","I put the bottle on the table. The bottle stands on the table.","","✔","✔","",""],["","A2","4","Places","Wo? / Wohin? with places","Wo: in der Stadt, im Kino, beim Arzt, bei Freunden, zu Hause, auf der Post. Wohin: in die Stadt, ins Kino, zum Arzt, zu Freunden, nach Hause, auf die Post. Countries/cities without article: nach Italien, in Italien; with article: in die Schweiz, in der Schweiz.","Ich bin beim Arzt. / Ich gehe zum Arzt.","I'm at the doctor's. / I'm going to the doctor.","","✔","✔","","Persons → bei/zu; cities/countries → in/nach; institutions → in/auf."],["","A2","5","Subordinate clauses","weil (because)","Verb goes to the END; comma before. Nebensatz first → main clause verb comes right after the comma (inversion).","Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","I'm learning German because I want to work in Germany.","","","","","weil ≠ denn (denn doesn't change word order)."],["","A2","5","Subordinate clauses","dass (that)","Introduces content clauses after verbs like sagen, glauben, wissen, hoffen. Verb at the end.","Ich glaube, dass er heute kommt.","I think (that) he's coming today.","","","","","dass (conjunction) ≠ das (article/pronoun)."],["","A2","5","Subordinate clauses","wenn (if / whenever)","Condition or repeated event in present/future. Verb at the end.","Wenn es regnet, bleibe ich zu Hause.","If/When it rains I stay at home.","","","","",""],["","A2","5","Word order","Verbs in the Nebensatz","Conjugated verb LAST. Modal: …, weil ich arbeiten muss. Perfekt: …, weil ich krank gewesen bin. Separable verb stays together: …, weil ich früh aufstehe.","Ich bleibe zu Hause, weil ich früh aufstehen muss.","I stay home because I have to get up early.","","","","",""],["","A2","5","Health","weh tun / Mir ist…","Body pain: Mir tut der Kopf weh. / Ich habe Kopfschmerzen. Feeling: Mir ist schlecht/kalt/schwindlig (Dativ + sein).","Mir tut der Rücken weh. Was fehlt Ihnen?","My back hurts. What's wrong with you?","✔","","✔","","The body part is Nominativ (subject); the person is Dativ."],["","A2","5","Indirect questions","ob + Nebensatz","Yes/No question inside a sentence: ob + verb at the end.","Ich weiß nicht, ob er kommt.","I don't know whether he's coming.","","","","",""],["","A2","5","Indirect questions","Indirect W-questions","W-word introduces the clause; verb at the end.","Können Sie mir sagen, wo der Bahnhof ist?","Can you tell me where the station is?","","","","",""],["","A2","5","Conjunctions","als vs. wenn","als = ONE event in the past; wenn = repeated event (past/present) or future/condition.","Als ich klein war, wohnten wir in Köln. / Wenn ich Zeit habe, lese ich.","When I was little we lived in Cologne. / When I have time I read.","","","","","'Immer wenn' = every time that (past habit)."],["","A2","5","Reflexive verbs","Reflexive pronouns (Akk)","mich, dich, sich, sich, sich, uns, euch, sich, sich. Verbs: sich waschen, sich anziehen, sich freuen, sich treffen, sich setzen, sich interessieren (für).","Ich freue mich. Wir treffen uns um acht.","I'm happy. We meet at eight.","","✔","","","Position: after the verb (or after the subject pronoun in inversion)."],["","A2","5","Reflexive verbs","Reflexive pronouns (Dativ)","When a body part/other Akk object is present the reflexive pronoun is Dativ: mir, dir, sich, uns, euch, sich.","Ich wasche mir die Hände. Sie kauft sich ein Auto.","I wash my hands. She buys herself a car.","","","✔","","Ich wasche mich (Akk) vs. Ich wasche mir die Hände (Dat)."],["","A2","5","Verbs","kennen vs. wissen vs. können","kennen = be acquainted with (person/place; Akk); wissen = know a fact; können = know how to / be able to.","Ich kenne ihn. Ich weiß, wo er wohnt. Ich kann Deutsch.","I know him. I know where he lives. I know German.","","✔","","",""],["","A2","6","Comparison","Comparative & superlative","Comparative: adjective + -er (+ umlaut for many one-syllable words: alt → älter). Superlative: am + adjective + -sten. Irregular: gut–besser–am besten, viel–mehr–am meisten, gern–lieber–am liebsten, hoch–höher–am höchsten, nah–näher–am nächsten.","Berlin ist größer als Hamburg. München ist am teuersten.","Berlin is bigger than Hamburg. Munich is the most expensive.","","","","","Equality: so + adjective + wie (so groß wie). Difference: comparative + als."],["","A2","6","Adjective endings","After the definite article (Nom/Akk)","Nom: -e (m/f/n), -en (pl). Akk: -en (m), -e (f), -e (n), -en (pl).","Der neue Tisch ist schön. Ich kaufe den neuen Tisch.","The new table is nice. I'm buying the new table.","✔","✔","","","'Der Neue Tisch' – adjectives are NOT capitalised before nouns."],["","A2","6","Question words","welcher / welche / welches","Declines like dieser: Welchen Pullover magst du?","Welchen Film hast du gesehen?","Which film did you see?","✔","✔","","",""],["","A2","6","Adjective endings","After the indefinite article (ein/kein/mein)","Nom: -er (m), -e (f), -es (n), -en (pl). Akk: -en (m), -e (f), -es (n), -en (pl). Ending shows what the article doesn't (ein has no ending in m/n Nom).","Das ist ein guter Job. Ich habe ein neues Handy.","That is a good job. I have a new phone.","✔","✔","","",""],["","A2","6","Adjective endings","Dativ","After dem/der/dem/den or einem/einer/einem: always -en.","Ich fahre mit dem neuen Auto. Mit einer guten Freundin.","I drive with the new car. With a good friend.","","","✔","",""],["","A2","6","Genitive (intro)","Genitiv with names","Add -s to names (no apostrophe): Annas Auto. After s/ß/x/z apostrophe: Thomas' Auto. Modern speech often uses von + Dativ: das Auto von meinem Vater.","Das ist Annas Buch. Das ist das Auto meines Vaters.","That is Anna's book. That's my father's car.","","","","✔","Formal: des Vaters (masc. Genitiv article = des + noun-(e)s)."],["","A2","6","Prepositions (work)","als / bei / in with jobs","als + profession (no article): als Ingenieur arbeiten; bei + company: bei Siemens; in + place: in einer Firma, in der Schule.","Ich arbeite als Lehrer bei einer Schule in Berlin.","I work as a teacher at a school in Berlin.","","","✔","",""],["","A2","7","Konjunktiv II","Polite requests","hätte, wäre, könnte, würde + infinitive: Ich hätte gern…, Könnten Sie…?, Würden Sie bitte…? Sounds much more polite than the indicative.","Ich hätte gern einen Tee. Könnten Sie mir helfen?","I'd like a tea. Could you help me?","","✔","✔","",""],["","A2","7","Präteritum","Regular verbs (recognition)","Stem + -te, -test, -te, -ten, -tet, -ten: wohnte, machte, sagte, lernte. Common in written narratives.","Er wohnte damals in Wien.","He lived in Vienna back then.","","","","","Full Präteritum in Week 8."],["","A2","7","Prepositions","nach + Dativ (time)","nach dem Essen, nach der Arbeit, nach dem Unterricht.","Nach dem Essen trinke ich einen Kaffee.","After eating I have a coffee.","","","✔","",""],["","A2","7","Infinitive clauses","zu + Infinitiv","zu directly before the infinitive; comma usually; separable verbs: zu between prefix and stem (aufzustehen).","Ich habe keine Lust, heute zu arbeiten. Ich versuche, früh aufzustehen.","I don't feel like working today. I'm trying to get up early.","","","","","No zu after modals, werden, lassen, gehen, bleiben."],["","A2","7","Infinitive clauses","um … zu (purpose)","um + … + zu + infinitive; only when both clauses have the SAME subject.","Ich lerne Deutsch, um in Deutschland zu arbeiten.","I learn German in order to work in Germany.","","","","","Different subjects → damit (B1)."],["","A2","7","Future","Futur I","werden + infinitive at the end. In everyday speech present + time word is much more common.","Nächstes Jahr werde ich nach Berlin ziehen. / Nächstes Jahr ziehe ich nach Berlin.","Next year I will move to Berlin.","","","","","werden: werde, wirst, wird, werden, werdet, werden."],["","A2","7","Verbs + prepositions","Fixed prepositions","Many verbs need a fixed preposition which fixes the case: warten auf + Akk, sich freuen auf + Akk, sich interessieren für + Akk, träumen von + Dat, teilnehmen an + Dat, sprechen mit + Dat.","Ich warte auf den Bus. Ich träume von einem Haus.","I'm waiting for the bus. I'm dreaming of a house.","","✔","✔","","Learn the verb WITH its preposition and case."],["","A2","7","da-/wo-compounds","Pronominal adverbs","Things: da(r)- + preposition (darauf, daran, dafür, damit); question wo(r)- + preposition (worauf, woran, wofür, womit). People: preposition + pronoun (auf ihn, mit wem).","Worauf wartest du? – Ich warte darauf. / Auf wen wartest du? – Auf meinen Freund.","What are you waiting for? – I'm waiting for it. / Who are you waiting for?","","✔","✔","","Add -r- before a vowel: darauf, woran."],["","A2","7","Connectors","deshalb / darum / deswegen","Give a consequence. They stand in position 1 → verb in position 2 (inversion). = 'therefore'.","Ich bin krank, deshalb bleibe ich zu Hause.","I'm sick, therefore I'm staying home.","","","","","See sheet 'Connectors' for all with examples."],["","A2","7","Connectors","trotzdem, außerdem, sonst","trotzdem = nevertheless; außerdem = besides; sonst = otherwise. Position 1 + verb 2.","Es regnet, trotzdem gehen wir spazieren.","It's raining; we're going for a walk anyway.","","","","",""],["","A2","7","Conjunctions","während, bevor, nachdem (intro)","Subordinating: verb at the end. während = while; bevor = before; nachdem = after (nachdem + Perfekt, main clause Präsens).","Bevor ich schlafe, lese ich. Nachdem ich gegessen habe, gehe ich spazieren.","Before I sleep I read. After I have eaten I go for a walk.","","","","",""],["","A2","7","Formal writing","Formal email","Betreff → Sehr geehrte Damen und Herren / Sehr geehrter Herr…, → Text (Sie-form) → Mit freundlichen Grüßen. Informal: Liebe/r …, → Viele Grüße / Bis bald.","Sehr geehrte Frau Müller, ich möchte einen Termin vereinbaren. Mit freundlichen Grüßen, Anna Schmidt","Dear Ms Müller, I'd like to make an appointment. Kind regards, Anna Schmidt","","","","","'Sehr geehrte Damen und Herren' when the person is unknown."],["","A2","7","Case review","Nom / Akk / Dat overview","Nominativ: subject. Akkusativ: direct object, direction, für/durch/gegen/ohne/um. Dativ: indirect object, location, aus/bei/mit/nach/seit/von/zu. See 'Case Tables'.","Der Lehrer (N) gibt dem Schüler (D) einen Stift (A).","The teacher gives the pupil a pen.","✔","✔","✔","","Use colours: N = blue, A = red, D = green, G = gold."],["","A2","7","Tense review","Perfekt vs. Präteritum review","Spoken: Perfekt (+ Präteritum of sein/haben/modals). Written narrative: Präteritum. Check with the Irregular Verbs sheet.","Ich war gestern im Kino und habe einen Film gesehen.","I was at the cinema yesterday and saw a film.","","","","",""],["","B1","8","Subordinate clauses","Nebensatz – complete rules","Conjugated verb LAST. With Perfekt: …, dass er das Buch gelesen hat. Separable verbs stay together: …, weil er früh aufsteht. Nebensatz first → inversion in main clause: Obwohl es regnet, gehen wir spazieren.","Ich weiß, dass er gestern nicht gekommen ist.","I know that he didn't come yesterday.","","","","","In a Perfekt Nebensatz the auxiliary (hat/ist) is the LAST word."],["","B1","8","Subordinate clauses","damit vs. um … zu","damit + own subject: Ich erkläre es dir, damit du es verstehst. um…zu only with SAME subject: Ich lerne, um die Prüfung zu bestehen.","Sie spart Geld, damit ihr Sohn studieren kann.","She saves money so that her son can study.","","","","","Same subject → prefer um…zu; different subjects → damit."],["","B1","8","Subordinate clauses","Subject & verb order","In a Nebensatz the subject comes directly after the conjunction (before objects, adverbs).","…, weil ich heute keine Zeit habe.","…, because I have no time today.","","","","",""],["","B1","8","Präteritum","Regular verbs","stem + -te, -test, -te, -ten, -tet, -ten (stem in -t/-d: + e: arbeitete, wartete).","Er arbeitete in München. Wir wohnten in Wien.","He worked in Munich. We lived in Vienna.","","","","",""],["","B1","8","Präteritum","Irregular verbs","Vowel change; NO ending in 1st & 3rd person singular: ging, kam, sah, aß, fuhr. du + -st, wir/sie + -en, ihr + -t.","Ich ging nach Hause und sah einen Film.","I went home and watched a film.","","","","","Learn the three principal parts (see 'Irregular Verbs')."],["","B1","8","Präteritum","Mixed verbs","Vowel change AND -te ending: bringen – brachte, denken – dachte, kennen – kannte, nennen – nannte, wissen – wusste, rennen – rannte.","Er wusste die Antwort nicht.","He didn't know the answer.","","","","",""],["","B1","8","Plusquamperfekt","Past perfect","hatte/war + Partizip II. Action BEFORE another past action. nachdem + Plusquamperfekt → main clause Präteritum.","Nachdem ich gegessen hatte, ging ich spazieren.","After I had eaten I went for a walk.","","","","","Perfekt version in speech: Nachdem ich gegessen hatte, bin ich spazieren gegangen."],["","B1","8","Usage","Präteritum vs. Perfekt","Written narrative, reports & stories → Präteritum. Spoken language → Perfekt (except sein/haben/modals). Southern Germany, Austria, Switzerland use Perfekt even more.","Damals lebte er in Paris. / Ich habe gestern gearbeitet.","He lived in Paris back then. / I worked yesterday.","","","","",""],["","B1","9","Relative clauses","Relative pronoun forms","Nom: der/die/das/die. Akk: den/die/das/die. Dat: dem/der/dem/denen. (Gen: dessen/deren/dessen/deren.) Same as definite article except Dat plural (denen) and Gen.","Der Mann, der neben mir wohnt, ist Arzt.","The man who lives next to me is a doctor.","✔","","","","Gender/number from the noun (Mann → der); case from its role IN the relative clause."],["","B1","9","Relative clauses","Relative pronoun as Akkusativ","Der Film, den ich gestern gesehen habe, war toll. (den = masc. + object of 'gesehen habe')","Das ist das Buch, das ich gelesen habe.","That's the book that I read.","","✔","","","Comma before the relative pronoun; verb at the end."],["","B1","9","Relative clauses","Relative pronoun as Dativ","Die Frau, der ich geholfen habe, ist meine Nachbarin. (der = fem. Dat: helfen + Dat)","Die Kinder, denen wir geholfen haben, sind glücklich.","The children we helped are happy.","","","✔","","denen = plural Dativ."],["","B1","9","Relative clauses","With prepositions","Preposition + relative pronoun: Das Haus, in dem ich wohne, ist alt. Die Freundin, mit der ich reise, kommt aus Peru.","Das ist der Mann, mit dem ich arbeite.","That's the man I work with.","","✔","✔","","The preposition determines the case."],["","B1","9","Relative clauses","was / wo as relatives","alles/etwas/nichts/das Beste + was; entire clause → was; places → wo.","Alles, was du sagst, stimmt. Die Stadt, wo ich geboren bin, ist klein.","Everything you say is true. The city where I was born is small.","","","","",""],["","B1","9","Genitive","Articles & noun endings","des (m/n), der (f), des (n), der (pl). Masculine & neuter nouns add -(e)s: des Mannes, des Hauses, des Kindes. Question: Wessen?","Das Auto des Mannes ist neu. Die Farbe der Wand gefällt mir.","The man's car is new. I like the colour of the wall.","","","","✔","-es after one-syllable nouns & nouns ending in s, ß, x, z, sch, tz; otherwise -s."],["","B1","9","Genitive","Genitive prepositions","wegen, trotz, während, statt/anstatt, innerhalb, außerhalb. Colloquially + Dativ; in writing use Genitiv.","Wegen des schlechten Wetters bleiben wir zu Hause.","Because of the bad weather we stay at home.","","","","✔","Plural nouns without article: Dativ (wegen Bauarbeiten)."],["","B1","9","Genitive","Relative Genitiv","dessen (m/n), deren (f/pl) = whose. No article follows.","Der Mann, dessen Auto ich gekauft habe, ist Lehrer.","The man whose car I bought is a teacher.","","","","✔","Don't add another article after dessen/deren."],["","B1","9","Genitive","Genitive vs. von + Dativ","Written/formal: Genitiv (das Haus meines Onkels). Spoken: von + Dativ (das Haus von meinem Onkel). Von + Dat is obligatory with plural nouns without article.","das Haus meines Onkels / das Haus von meinem Onkel","my uncle's house","","","✔","✔",""],["","B1","10","Adjective endings","After the definite article (all cases)","Nom: -e -e -e -en. Akk: -en -e -e -en. Dat: -en -en -en -en. Gen: -en -en -en -en (m f n pl).","Der große Hund, die kleine Katze, das neue Auto, die alten Häuser.","the big dog, the small cat, the new car, the old houses","✔","✔","✔","✔","'Weak' declension: the article already shows case, so the adjective mostly -en."],["","B1","10","Adjective endings","After ein-words (ein, kein, mein…)","Nom: -er -e -es -en. Akk: -en -e -es -en. Dat: -en -en -en -en. Gen: -en -er -en -er.","ein großer Hund, eine kleine Katze, ein neues Auto, keine alten Häuser","a big dog, a small cat, a new car, no old houses","✔","✔","✔","✔","'Mixed' declension: ein has no ending in m/n Nom → adjective shows it."],["","B1","10","Adjective endings","Without article","Endings like the definite article: Nom -er -e -es -e; Akk -en -e -es -e; Dat -em -er -em -en; Gen -en -er -en -er.","frischer Kaffee, kalte Milch, frisches Brot, gute Freunde","fresh coffee, cold milk, fresh bread, good friends","✔","✔","✔","✔","'Strong' declension. Used after numbers & quantifiers too (zwei große Hunde)."],["","B1","10","Adjective endings","After viele, alle, einige, mehrere, wenige","Plural: viele/einige/mehrere/wenige + strong ending (-e Nom/Akk, -en Dat, -er Gen). After alle/beide: -en.","Ich habe viele neue Freunde. Mit vielen neuen Freunden.","I have many new friends. With many new friends.","✔","✔","✔","",""],["","B1","10","Adjectives as nouns","der Deutsche, ein Deutscher","Capitalised; endings as normal adjectives: der Deutsche / ein Deutscher; die Bekannte / eine Bekannte; das Gute.","Ich kenne einen Deutschen. Der Angestellte hilft.","I know a German. The employee helps.","✔","✔","✔","",""],["","B1","10","n-Deklination","Masculine weak nouns","Add -n/-en in every case except Nominativ singular: der Junge – den/dem/des Jungen. Includes: Kunde, Kollege, Student, Nachbar, Mensch, Herr (Herrn), Name (Namens), Polizist, Praktikant.","Ich kenne den Studenten. Ich helfe dem Kunden.","I know the student. I help the customer.","","✔","✔","","Mostly masculine persons/animals ending in -e, -ent, -ist, -at, -oge, -graf."],["","B1","10","Passive","Vorgangspassiv Präsens","werden + Partizip II. Active Akk object → passive Nom subject. Agent (optional): von + Dat (person) / durch + Akk (means).","Das Auto wird repariert. Das Haus wird von der Firma gebaut.","The car is being repaired. The house is built by the company.","✔","✔","✔","","Aktiv: Der Chef lobt den Mitarbeiter. → Passiv: Der Mitarbeiter wird (vom Chef) gelobt."],["","B1","10","Passive","Dativ objects stay Dativ","Verbs with Dativ (helfen, danken, gratulieren…) keep the Dativ in the passive; sentence has no subject (or 'es').","Dem Kind wird geholfen. Mir wurde gratuliert.","The child is being helped. I was congratulated.","","","✔","","Subjectless: verb = 3rd person singular."],["","B1","10","Passive","Passive with modals","Modal + Partizip II + werden (infinitive at the end).","Das Problem muss gelöst werden. Hier darf nicht geraucht werden.","The problem must be solved. Smoking is not allowed here.","✔","","","",""],["","B1","10","Usage","When to use the passive","Agent unknown/unimportant; process/instructions; formal writing. Prefer active when the agent matters.","Der Brief wird morgen geschickt.","The letter will be sent tomorrow.","","","","",""],["","B1","10","Passive","Präteritum","wurde + Partizip II (wurde, wurdest, wurde, wurden, wurdet, wurden).","Das Haus wurde 1990 gebaut.","The house was built in 1990.","✔","","","",""],["","B1","10","Passive","Perfekt & Plusquamperfekt","Perfekt: ist + Partizip II + worden. Plusquamperfekt: war + Partizip II + worden. Passive uses 'worden' (not 'geworden').","Das Haus ist gebaut worden. / Das Haus war gebaut worden.","The house has been built. / The house had been built.","✔","","","","'worden' only in the passive; 'geworden' = became."],["","B1","10","Passive","Zustandspassiv","sein + Partizip II = resulting state (not the process).","Die Tür ist geschlossen. Das Geschäft ist geöffnet.","The door is closed. The shop is open.","✔","","","","Vorgangspassiv: Die Tür wird geschlossen (process)."],["","B1","10","Passive","Impersonal passive & man","Subjectless passive with 'es' or place: Hier wird gearbeitet. 'man' as active alternative: Man spricht hier Deutsch.","In Bayern wird viel Bier getrunken.","A lot of beer is drunk in Bavaria.","","","","",""],["","B1","11","Konjunktiv II","Forms","würde + Infinitiv (all verbs). Short forms for common verbs: wäre, hätte, könnte, müsste, dürfte, sollte, wollte, käme, ginge, wüsste, gäbe, täte. Strong verbs: Präteritum stem + umlaut + -e (kam → käme).","Ich wäre gern reich. Ich hätte gern mehr Zeit.","I'd like to be rich. I'd like to have more time.","","","","","Regular (weak) verbs: KII = Präteritum → use würde + Inf instead."],["","B1","11","Konjunktiv II","Irreal conditions","Wenn-clause (KII) + main clause (würde/KII). Both unreal/hypothetical.","Wenn ich mehr Zeit hätte, würde ich mehr reisen.","If I had more time I would travel more.","","","","","Avoid würde in the wenn-clause in formal writing."],["","B1","11","Konjunktiv II","Wishes & advice","Ich wünschte, ich hätte…; Wenn ich nur…!; Du solltest…; An deiner Stelle würde ich…","An deiner Stelle würde ich den Job nehmen.","If I were you I'd take the job.","","","","",""],["","B1","11","Konjunktiv II","Past (Vergangenheit)","hätte/wäre + Partizip II. Unreal past events or regrets.","Wenn ich das gewusst hätte, wäre ich gekommen.","If I had known that, I'd have come.","","","","","haben/sein rule same as Perfekt."],["","B1","11","Verbs + prepositions","Akkusativ pairs","warten auf, sich freuen auf/über, sich ärgern über, denken an, sich erinnern an, sich interessieren für, sich entscheiden für, sich bewerben um, sich kümmern um, bitten um, sich verlieben in, hoffen auf, sich verlassen auf.","Ich freue mich auf den Urlaub. Er interessiert sich für Musik.","I'm looking forward to the holiday. He is interested in music.","","✔","","",""],["","B1","11","Verbs + prepositions","Dativ pairs","teilnehmen an, arbeiten
